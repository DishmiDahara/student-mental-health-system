<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Brain Test: Tricky Puzzles</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: white; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 16px; overflow: hidden;
  }
  .header { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 440px; margin-bottom: 12px; }
  .title { font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 8px; color: #38bdf8; }
  .canvas-box {
    position: relative; width: 380px; height: 380px; background: #1e293b;
    border-radius: 24px; border: 2px solid #334155; display: flex; flex-direction: column;
    align-items: center; justify-content: center; box-shadow: 0 20px 40px rgba(0,0,0,0.5);
  }
  .riddle-title { position: absolute; top: 20px; font-size: 17px; font-weight: 800; color: #f8fafc; text-align: center; }
  .item-row { display: flex; gap: 24px; align-items: flex-end; margin-top: 40px; }
  .clickable-item {
    font-size: 48px; cursor: pointer; transition: transform .15s; display: flex; flex-direction: column; align-items: center;
  }
  .clickable-item:hover { transform: scale(1.1); }
  .tip { margin-top: 14px; font-size: 13.5px; color: #94a3b8; font-weight: 600; text-align: center; }
</style>
</head>
<body>
<div class="header">
  <div class="title"><span>💡</span> Brain Test</div>
  <div style="font-size:13px; color:#38bdf8; font-weight:700;">Riddle 1</div>
</div>
<div class="canvas-box" id="box">
  <div class="riddle-title" id="riddle">Who is the tallest of all?</div>
  <div class="item-row" id="items">
    <div class="clickable-item" onclick="wrongChoice()">
      <span>🌳</span>
      <span style="font-size:12px; color:#cbd5e1;">Tree</span>
    </div>
    <div class="clickable-item" id="giraffe" onclick="stretchGiraffe()">
      <span>🦒</span>
      <span style="font-size:12px; color:#cbd5e1;">Giraffe</span>
    </div>
    <div class="clickable-item" onclick="wrongChoice()">
      <span>🐘</span>
      <span style="font-size:12px; color:#cbd5e1;">Elephant</span>
    </div>
  </div>
</div>
<div class="tip" id="tip">Think outside the box! Tap the giraffe repeatedly to stretch its neck up high!</div>

<script>
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function ding(f = 600) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.frequency.setValueAtTime(f, audioCtx.currentTime);
    g.gain.setValueAtTime(0.2, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.25);
  }

  let stretch = 1;
  function stretchGiraffe() {
    stretch += 0.4;
    ding(400 + (stretch * 60));
    document.getElementById('giraffe').style.transform = `scaleY(${stretch})`;
    if (stretch >= 2.6) {
      ding(880);
      document.getElementById('tip').innerHTML = '<span style="color:#38bdf8; font-weight:800; font-size:15px;">🎉 Haha! Giraffe reached the clouds! Clever thinking!</span>';
    }
  }

  function wrongChoice() {
    ding(220);
    document.getElementById('tip').textContent = 'Not quite! Try interacting with the giraffe!';
  }
</script>
</body>
</html>
