<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Blocky Blast Puzzle</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: white; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 16px; overflow: hidden;
  }
  .header { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 440px; margin-bottom: 16px; }
  .title { font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 8px; color: #38bdf8; }
  .grid-box {
    width: 340px; height: 340px; background: #1e293b; border-radius: 20px;
    border: 2px solid rgba(255,255,255,0.1); display: grid; grid-template-columns: repeat(6, 1fr);
    padding: 12px; gap: 6px; box-shadow: 0 20px 40px rgba(0,0,0,0.5);
  }
  .cell {
    background: #334155; border-radius: 8px; cursor: pointer; transition: background .15s, transform .1s;
  }
  .cell:hover { filter: brightness(1.2); }
  .cell.filled { background: #38bdf8; box-shadow: 0 0 8px #38bdf8; }
  .tip { margin-top: 16px; font-size: 13.5px; color: #94a3b8; font-weight: 600; text-align: center; }
</style>
</head>
<body>
<div class="header">
  <div class="title"><span>🧱</span> Blocky Blast</div>
  <div style="font-size:13px; color:#38bdf8; font-weight:700;" id="score">Score: 0</div>
</div>
<div class="grid-box" id="grid"></div>
<div class="tip" id="tip">Tap cells to place soothing blocks and clear entire rows!</div>

<script>
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function blastSound() {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.frequency.setValueAtTime(580, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.2);
    g.gain.setValueAtTime(0.2, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.2);
  }

  let board = Array(6).fill(null).map(() => Array(6).fill(false));
  let score = 0;

  function render() {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    for (let r = 0; r < 6; r++) {
      for (let c = 0; c < 6; c++) {
        const el = document.createElement('div');
        el.className = 'cell' + (board[r][c] ? ' filled' : '');
        el.onclick = () => placeBlock(r, c);
        grid.appendChild(el);
      }
    }
  }

  function placeBlock(r, c) {
    if (!board[r][c]) {
      board[r][c] = true;
      score += 10;
      document.getElementById('score').textContent = `Score: ${score}`;
      checkLines();
      render();
    }
  }

  function checkLines() {
    let cleared = false;
    for (let r = 0; r < 6; r++) {
      if (board[r].every(v => v)) {
        board[r].fill(false);
        cleared = true;
        score += 100;
      }
    }
    if (cleared) {
      blastSound();
      document.getElementById('score').textContent = `Score: ${score}`;
      document.getElementById('tip').innerHTML = '<span style="color:#38bdf8; font-weight:800;">✨ Line blasted! Great flow!</span>';
    }
  }

  render();
</script>
</body>
</html>
