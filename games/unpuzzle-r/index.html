<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>UnpuzzleR</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: white; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 16px; overflow: hidden;
  }
  .header { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 440px; margin-bottom: 16px; }
  .title { font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 8px; color: #f59e0b; }
  .canvas-box {
    position: relative; width: 360px; height: 360px; background: #1e293b;
    border-radius: 24px; border: 2px solid #334155; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 20px 40px rgba(0,0,0,0.5);
  }
  canvas { width: 100%; height: 100%; cursor: pointer; touch-action: none; }
  .btn {
    background: #f59e0b; border: none; color: #0f172a; padding: 10px 20px; border-radius: 14px;
    font-size: 14px; font-weight: 800; cursor: pointer; margin-top: 16px;
  }
  .tip { margin-top: 14px; font-size: 13.5px; color: #94a3b8; font-weight: 600; text-align: center; }
</style>
</head>
<body>
<div class="header">
  <div class="title"><span>🔐</span> UnpuzzleR</div>
  <div style="font-size:13px; color:#f59e0b; font-weight:700;">Radial Rings</div>
</div>
<div class="canvas-box">
  <canvas id="cvs" width="360" height="360"></canvas>
</div>
<button class="btn" onclick="checkUnlock()">🔓 Release Lock Core</button>
<div class="tip" id="tip">Rotate both circular rings to line up the keyways at the top</div>

<script>
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function lockChime(f = 500) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.frequency.setValueAtTime(f, audioCtx.currentTime);
    g.gain.setValueAtTime(0.2, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.25);
  }

  const cvs = document.getElementById('cvs');
  const ctx = cvs.getContext('2d');

  let outerAngle = 90;
  let innerAngle = 180;
  let draggingRing = null;

  function render() {
    ctx.clearRect(0, 0, cvs.width, cvs.height);
    const cx = 180, cy = 180;

    // Outer Ring
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate((outerAngle * Math.PI) / 180);
    ctx.strokeStyle = '#0284c7';
    ctx.lineWidth = 24;
    ctx.beginPath();
    ctx.arc(0, 0, 120, 0.3, Math.PI * 2 - 0.3); // notch opening
    ctx.stroke();
    ctx.restore();

    // Inner Ring
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate((innerAngle * Math.PI) / 180);
    ctx.strokeStyle = '#f59e0b';
    ctx.lineWidth = 20;
    ctx.beginPath();
    ctx.arc(0, 0, 80, 0.4, Math.PI * 2 - 0.4); // notch opening
    ctx.stroke();
    ctx.restore();

    // Golden Core
    ctx.fillStyle = '#fbbf24';
    ctx.beginPath();
    ctx.arc(cx, cy, 30, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#0f172a';
    ctx.font = '22px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('🔑', cx, cy + 8);
  }

  cvs.onpointerdown = e => {
    const r = cvs.getBoundingClientRect();
    const d = Math.hypot(e.clientX - r.left - 180, e.clientY - r.top - 180);
    if (d > 100 && d < 140) draggingRing = 'outer';
    else if (d > 60 && d < 100) draggingRing = 'inner';
  };

  cvs.onpointermove = e => {
    if (draggingRing) {
      const r = cvs.getBoundingClientRect();
      const ang = Math.atan2(e.clientX - r.left - 180, -(e.clientY - r.top - 180)) * (180 / Math.PI);
      if (draggingRing === 'outer') outerAngle = ang;
      else if (draggingRing === 'inner') innerAngle = ang;
      render();
    }
  };

  window.onpointerup = () => draggingRing = null;

  function checkUnlock() {
    // Top is roughly -90 to 0 degrees based on math
    const oDiff = Math.abs((outerAngle % 360));
    const iDiff = Math.abs((innerAngle % 360));
    if (oDiff < 30 && iDiff < 30) {
      lockChime(880);
      document.getElementById('tip').innerHTML = '<span style="color:#f59e0b; font-weight:800; font-size:15px;">🎉 Unlocked! Core released with absolute precision.</span>';
    } else {
      lockChime(250);
      document.getElementById('tip').textContent = 'Keyways not aligned yet. Rotate both ring openings to the top!';
    }
  }

  render();
</script>
</body>
</html>
