<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Procedural Harmony Sketch</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    canvas { width: 100%; height: 100%; display: block; touch-action: none; background: #0f172a; cursor: crosshair; }
    .header-tip { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); z-index: 10; color: #cbd5e1; font-size: 13px; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(8px); padding: 6px 16px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.12); pointer-events: none; }
    .toolbar { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px); padding: 8px 16px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.15); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .btn { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: #e2e8f0; padding: 6px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s; }
    .btn:hover { background: rgba(255,255,255,0.18); }
    .btn.active { background: #8b5cf6; border-color: #a78bfa; color: white; box-shadow: 0 0 12px rgba(139,92,246,0.5); }
    .palette { display: flex; align-items: center; gap: 6px; margin-left: 4px; padding-left: 8px; border-left: 1px solid rgba(255,255,255,0.15); }
    .color-dot { width: 20px; height: 20px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; transition: transform 0.15s; }
    .color-dot.active { border-color: white; transform: scale(1.15); }
  </style>
</head>
<body>
  <div class="header-tip">✨ Sketch freely · Procedural harmony brushes create gentle art</div>
  <canvas id="sketchCanvas"></canvas>
  <div class="toolbar">
    <button class="btn active" id="btnRibbon" onclick="setBrush('ribbon')">🎀 Ribbon</button>
    <button class="btn" id="btnSketchy" onclick="setBrush('sketchy')">✏️ Sketchy</button>
    <button class="btn" id="btnWeb" onclick="setBrush('web')">🕸️ Web</button>
    <button class="btn" id="btnFur" onclick="setBrush('fur')">🪶 Soft Fur</button>
    <div class="palette">
      <div class="color-dot active" style="background: #a78bfa;" onclick="setColor('#a78bfa', this)"></div>
      <div class="color-dot" style="background: #38bdf8;" onclick="setColor('#38bdf8', this)"></div>
      <div class="color-dot" style="background: #34d399;" onclick="setColor('#34d399', this)"></div>
      <div class="color-dot" style="background: #fbbf24;" onclick="setColor('#fbbf24', this)"></div>
      <div class="color-dot" style="background: #f472b6;" onclick="setColor('#f472b6', this)"></div>
      <div class="color-dot" style="background: #f8fafc;" onclick="setColor('#f8fafc', this)"></div>
    </div>
    <button class="btn" onclick="clearCanvas()">🧹 Clear</button>
  </div>

  <script>
    const canvas = document.getElementById('sketchCanvas');
    const ctx = canvas.getContext('2d');

    let currentBrush = 'ribbon';
    let currentColor = '#a78bfa';
    let isDrawing = false;
    let points = [];
    let ribbons = [];

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      ctx.scale(dpr, dpr);
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
    }
    window.addEventListener('resize', resize);
    resize();

    function setBrush(b) {
      currentBrush = b;
      document.querySelectorAll('.btn').forEach(el => el.classList.remove('active'));
      if (b === 'ribbon') document.getElementById('btnRibbon').classList.add('active');
      if (b === 'sketchy') document.getElementById('btnSketchy').classList.add('active');
      if (b === 'web') document.getElementById('btnWeb').classList.add('active');
      if (b === 'fur') document.getElementById('btnFur').classList.add('active');
    }

    function setColor(c, el) {
      currentColor = c;
      document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
      el.classList.add('active');
    }

    function clearCanvas() {
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
      points = [];
      ribbons = [];
    }

    function getCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const cx = e.touches ? e.touches[0].clientX : e.clientX;
      const cy = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: cx - rect.left, y: cy - rect.top };
    }

    canvas.addEventListener('pointerdown', e => {
      isDrawing = true;
      const pt = getCoords(e);
      points = [pt];
      ribbons = [];
      for (let i = 0; i < 7; i++) {
        ribbons.push({ x: pt.x, y: pt.y, vx: 0, vy: 0 });
      }
    });

    window.addEventListener('pointermove', e => {
      if (!isDrawing) return;
      const pt = getCoords(e);
      points.push(pt);

      ctx.save();
      ctx.strokeStyle = currentColor;

      // 1. Ribbon Brush
      if (currentBrush === 'ribbon') {
        ctx.lineWidth = 1.2;
        ctx.globalAlpha = 0.35;
        ribbons.forEach((r, idx) => {
          const dx = pt.x - r.x;
          const dy = pt.y - r.y;
          r.vx = (r.vx + dx * 0.035) * 0.82;
          r.vy = (r.vy + dy * 0.035) * 0.82;
          ctx.beginPath();
          ctx.moveTo(r.x, r.y);
          r.x += r.vx;
          r.y += r.vy;
          ctx.lineTo(r.x, r.y);
          ctx.stroke();
        });
      }

      // 2. Sketchy Brush (connects neighbor points)
      else if (currentBrush === 'sketchy') {
        ctx.lineWidth = 1;
        ctx.globalAlpha = 0.25;
        ctx.beginPath();
        ctx.moveTo(points[points.length - 2].x, points[points.length - 2].y);
        ctx.lineTo(pt.x, pt.y);
        ctx.stroke();

        for (let i = Math.max(0, points.length - 25); i < points.length - 1; i++) {
          const prev = points[i];
          const dist = Math.hypot(pt.x - prev.x, pt.y - prev.y);
          if (dist < 40 && Math.random() > 0.4) {
            ctx.beginPath();
            ctx.moveTo(pt.x + (Math.random() - 0.5) * 2, pt.y + (Math.random() - 0.5) * 2);
            ctx.lineTo(prev.x, prev.y);
            ctx.stroke();
          }
        }
      }

      // 3. Web Brush (spiderweb filaments)
      else if (currentBrush === 'web') {
        ctx.lineWidth = 0.8;
        ctx.globalAlpha = 0.2;
        for (let i = 0; i < points.length - 1; i++) {
          const prev = points[i];
          const dist = Math.hypot(pt.x - prev.x, pt.y - prev.y);
          if (dist < 80 && Math.random() > 0.7) {
            ctx.beginPath();
            ctx.moveTo(pt.x, pt.y);
            ctx.lineTo(prev.x, prev.y);
            ctx.stroke();
          }
        }
      }

      // 4. Fur Brush (soft organic hairs)
      else if (currentBrush === 'fur') {
        ctx.lineWidth = 0.9;
        ctx.globalAlpha = 0.3;
        const prev = points[points.length - 2] || pt;
        const dx = pt.x - prev.x;
        const dy = pt.y - prev.y;
        for (let i = 0; i < 4; i++) {
          const fx = pt.x + (Math.random() - 0.5) * 16;
          const fy = pt.y + (Math.random() - 0.5) * 16;
          ctx.beginPath();
          ctx.moveTo(fx, fy);
          ctx.lineTo(fx + dx * (1.5 + Math.random()), fy + dy * (1.5 + Math.random()));
          ctx.stroke();
        }
      }

      ctx.restore();
    });

    window.addEventListener('pointerup', () => { isDrawing = false; });
  </script>
</body>
</html>
