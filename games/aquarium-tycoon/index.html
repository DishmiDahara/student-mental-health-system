<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Pixel Aquarium Tycoon</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background: #082f49; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: white; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 16px; overflow: hidden;
  }
  .header { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 440px; margin-bottom: 12px; }
  .title { font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 8px; color: #38bdf8; }
  .tank-box {
    position: relative; width: 380px; height: 380px;
    background: radial-gradient(circle at 50% 20%, #0369a1 0%, #0c4a6e 60%, #082f49 100%);
    border-radius: 28px; border: 6px solid rgba(255,255,255,0.2); box-shadow: 0 25px 50px rgba(0,0,0,0.6);
    overflow: hidden;
  }
  canvas { width: 100%; height: 100%; cursor: pointer; }
  .action-bar { display: flex; gap: 10px; width: 100%; max-width: 380px; margin-top: 14px; }
  .btn {
    flex: 1; background: #0284c7; border: none; color: white; padding: 12px;
    border-radius: 14px; font-size: 13.5px; font-weight: 800; cursor: pointer;
    box-shadow: 0 4px 12px rgba(2,132,199,0.3); transition: transform .1s;
  }
  .btn:active { transform: scale(0.96); }
  .tip { margin-top: 12px; font-size: 13px; color: #bae6fd; font-weight: 600; text-align: center; }
</style>
</head>
<body>
<div class="header">
  <div class="title"><span>🐠</span> Pixel Aquarium</div>
  <div style="font-size:13px; color:#38bdf8; font-weight:800;" id="fishCount">4 Fish Swimming</div>
</div>
<div class="tank-box">
  <canvas id="cvs" width="380" height="380"></canvas>
</div>
<div class="action-bar">
  <button class="btn" onclick="feedFish()"><span>🪱</span> Feed Flakes</button>
  <button class="btn" style="background:#059669;" onclick="addFish()"><span>🐟</span> Add Fish</button>
</div>
<div class="tip" id="tip">Tap 'Feed Flakes' to drop food and watch fish gracefully flock!</div>

<script>
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function bubbleChime() {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.frequency.setValueAtTime(520, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(780, audioCtx.currentTime + 0.15);
    g.gain.setValueAtTime(0.2, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.15);
  }

  const cvs = document.getElementById('cvs');
  const ctx = cvs.getContext('2d');

  let fishes = [
    { x: 80, y: 150, vx: 1.5, vy: 0.3, icon: '🐠' },
    { x: 260, y: 220, vx: -1.2, vy: -0.2, icon: '🐟' },
    { x: 180, y: 100, vx: 0.8, vy: 0.4, icon: '🐡' },
    { x: 120, y: 290, vx: -1.4, vy: -0.3, icon: '🐠' }
  ];

  let flakes = [];

  function feedFish() {
    bubbleChime();
    for (let i = 0; i < 6; i++) {
      flakes.push({ x: 50 + Math.random() * 280, y: 20, vy: 0.8 + Math.random() * 0.6 });
    }
  }

  function addFish() {
    bubbleChime();
    fishes.push({
      x: 190, y: 190, vx: (Math.random() - 0.5) * 2, vy: (Math.random() - 0.5) * 1,
      icon: Math.random() < 0.5 ? '🐠' : '🐟'
    });
    document.getElementById('fishCount').textContent = `${fishes.length} Fish Swimming`;
  }

  function render() {
    ctx.clearRect(0, 0, cvs.width, cvs.height);

    // Coral plants at bottom
    ctx.font = '40px sans-serif';
    ctx.fillText('🪸', 30, 360);
    ctx.fillText('🌿', 120, 365);
    ctx.fillText('🪸', 280, 360);

    // Food flakes
    ctx.fillStyle = '#fde047';
    for (let i = flakes.length - 1; i >= 0; i--) {
      const fl = flakes[i];
      fl.y += fl.vy;
      ctx.beginPath();
      ctx.arc(fl.x, fl.y, 3, 0, Math.PI * 2);
      ctx.fill();
      if (fl.y > 360) flakes.splice(i, 1);
    }

    // Fish
    fishes.forEach(f => {
      f.x += f.vx;
      f.y += f.vy;

      if (f.x < 30 || f.x > 340) f.vx *= -1;
      if (f.y < 50 || f.y > 330) f.vy *= -1;

      // Attract to food if nearby
      if (flakes.length > 0) {
        const target = flakes[0];
        const dx = target.x - f.x;
        const dy = target.y - f.y;
        f.vx += dx * 0.005;
        f.vy += dy * 0.005;
      }

      ctx.save();
      ctx.translate(f.x, f.y);
      if (f.vx < 0) ctx.scale(-1, 1);
      ctx.font = '36px sans-serif';
      ctx.fillText(f.icon, -18, 12);
      ctx.restore();
    });

    requestAnimationFrame(render);
  }

  render();
</script>
</body>
</html>
