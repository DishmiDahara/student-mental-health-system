<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Fluid Simulation WebGL</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: white; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    overflow: hidden;
  }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: pointer; touch-action: none; }
  .hud {
    position: absolute; top: 16px; left: 16px; z-index: 10;
    background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); padding: 8px 16px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.15); font-size: 13.5px; font-weight: 700; color: #38bdf8;
  }
  .tip {
    position: absolute; bottom: 20px; z-index: 10; background: rgba(0,0,0,0.6);
    padding: 8px 18px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.15);
    color: #e2e8f0; font-size: 13px; font-weight: 600; text-align: center;
  }
</style>
</head>
<body>
<div class="hud">✨ Fluid Simulation 3D</div>
<canvas id="c"></canvas>
<div class="tip">Swirl your finger or mouse across the dark velvet to cast luminous bioluminescent fluids</div>

<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let width = canvas.width = window.innerWidth;
  let height = canvas.height = window.innerHeight;

  window.onresize = () => {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  };

  const particles = [];
  const MAX = 140;

  function addFluid(x, y) {
    for (let i = 0; i < 4; i++) {
      particles.push({
        x: x + (Math.random() - 0.5) * 20,
        y: y + (Math.random() - 0.5) * 20,
        vx: (Math.random() - 0.5) * 4,
        vy: (Math.random() - 0.5) * 4,
        radius: 20 + Math.random() * 30,
        hue: (Date.now() / 25) % 360,
        alpha: 0.8
      });
    }
  }

  canvas.onpointerdown = e => addFluid(e.clientX, e.clientY);
  canvas.onpointermove = e => { if (e.buttons > 0) addFluid(e.clientX, e.clientY); };

  function render() {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.12)';
    ctx.fillRect(0, 0, width, height);

    ctx.globalCompositeOperation = 'lighter';
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.alpha *= 0.96;
      p.radius *= 0.98;

      const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.radius);
      grad.addColorStop(0, `hsla(${p.hue}, 100%, 70%, ${p.alpha})`);
      grad.addColorStop(1, `hsla(${p.hue + 40}, 100%, 50%, 0)`);

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();

      if (p.alpha < 0.02) particles.splice(i, 1);
    }
    ctx.globalCompositeOperation = 'source-over';

    requestAnimationFrame(render);
  }

  // Initial gentle burst
  addFluid(width / 2, height / 2);
  render();
</script>
</body>
</html>
