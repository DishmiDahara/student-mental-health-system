<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Sugar, Sugar</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background: #18181b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: white; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 16px; overflow: hidden;
  }
  .header { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 440px; margin-bottom: 12px; }
  .title { font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 8px; color: #fde047; }
  .canvas-box {
    position: relative; width: 380px; height: 420px; background: #09090b;
    border-radius: 20px; border: 2px solid #27272a; box-shadow: 0 20px 40px rgba(0,0,0,0.6);
  }
  canvas { width: 100%; height: 100%; border-radius: 18px; cursor: crosshair; touch-action: none; }
  .btn-bar { display: flex; gap: 10px; margin-top: 14px; }
  .btn {
    background: #27272a; border: 1px solid #3f3f46; color: white; padding: 8px 16px;
    border-radius: 12px; font-size: 13px; font-weight: 700; cursor: pointer;
  }
  .btn:hover { background: #3f3f46; }
  .tip { margin-top: 10px; font-size: 13px; color: #a1a1aa; font-weight: 600; text-align: center; }
</style>
</head>
<body>
<div class="header">
  <div class="title"><span>☕</span> Sugar, Sugar</div>
  <div style="font-size:13px; color:#fde047; font-weight:700;" id="sugarCount">0 / 60 Sugar</div>
</div>
<div class="canvas-box">
  <canvas id="cvs" width="380" height="420"></canvas>
</div>
<div class="btn-bar">
  <button class="btn" onclick="clearLines()">✏️ Clear Lines</button>
  <button class="btn" onclick="resetGame()">🔄 Reset Cup</button>
</div>
<div class="tip" id="tip">Draw chalk lines to guide the falling sweet sugar grains into the mug</div>

<script>
  const cvs = document.getElementById('cvs');
  const ctx = cvs.getContext('2d');

  let particles = [];
  let lines = [];
  let curLine = null;
  let collected = 0;
  const TARGET = 60;

  const cup = { x: 230, y: 350, w: 70, h: 50 };

  function spawnSugar() {
    if (particles.length < 180 && collected < TARGET) {
      particles.push({
        x: 120 + (Math.random() * 16 - 8),
        y: 20,
        vx: (Math.random() - 0.5) * 0.5,
        vy: 1 + Math.random() * 1.5,
        r: 2.2
      });
    }
  }

  function clearLines() { lines = []; }
  function resetGame() { lines = []; particles = []; collected = 0; document.getElementById('sugarCount').textContent = `0 / ${TARGET} Sugar`; }

  cvs.onpointerdown = e => {
    const r = cvs.getBoundingClientRect();
    curLine = [{ x: e.clientX - r.left, y: e.clientY - r.top }];
  };
  cvs.onpointermove = e => {
    if (curLine) {
      const r = cvs.getBoundingClientRect();
      curLine.push({ x: e.clientX - r.left, y: e.clientY - r.top });
    }
  };
  window.onpointerup = () => {
    if (curLine && curLine.length > 1) lines.push(curLine);
    curLine = null;
  };

  function update() {
    spawnSugar();
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.vy += 0.08;
      p.x += p.vx;
      p.y += p.vy;

      // Cup collection
      if (p.x >= cup.x && p.x <= cup.x + cup.w && p.y >= cup.y && p.y <= cup.y + cup.h) {
        particles.splice(i, 1);
        collected++;
        document.getElementById('sugarCount').textContent = `${Math.min(collected, TARGET)} / ${TARGET} Sugar`;
        if (collected >= TARGET) {
          document.getElementById('tip').innerHTML = '<span style="color:#fde047; font-weight:800;">✨ Perfect cup of sweet tea! Relax & enjoy.</span>';
        }
        continue;
      }

      // Line collision
      lines.forEach(l => {
        for (let j = 0; j < l.length - 1; j++) {
          const p1 = l[j], p2 = l[j+1];
          const dist = distToSegment(p, p1, p2);
          if (dist < p.r + 4) {
            p.y -= 2;
            p.vy *= 0.2;
            p.vx += (p2.x - p1.x) * 0.03;
          }
        }
      });

      if (p.y > cvs.height) particles.splice(i, 1);
    }
  }

  function distToSegment(p, v, w) {
    const l2 = (v.x - w.x)**2 + (v.y - w.y)**2;
    if (l2 === 0) return Math.hypot(p.x - v.x, p.y - v.y);
    let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(p.x - (v.x + t * (w.x - v.x)), p.y - (v.y + t * (w.y - v.y)));
  }

  function render() {
    ctx.clearRect(0, 0, cvs.width, cvs.height);

    // Dispenser
    ctx.fillStyle = '#71717a';
    ctx.fillRect(105, 0, 30, 20);

    // Cup
    ctx.strokeStyle = '#fde047';
    ctx.lineWidth = 4;
    ctx.strokeRect(cup.x, cup.y, cup.w, cup.h);

    // Drawn lines
    ctx.strokeStyle = 'white';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    lines.forEach(l => {
      ctx.beginPath();
      ctx.moveTo(l[0].x, l[0].y);
      for (let j = 1; j < l.length; j++) ctx.lineTo(l[j].x, l[j].y);
      ctx.stroke();
    });
    if (curLine && curLine.length > 1) {
      ctx.beginPath();
      ctx.moveTo(curLine[0].x, curLine[0].y);
      for (let j = 1; j < curLine.length; j++) ctx.lineTo(curLine[j].x, curLine[j].y);
      ctx.stroke();
    }

    // Sugar particles
    ctx.fillStyle = '#ffffff';
    particles.forEach(p => {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    });

    update();
    requestAnimationFrame(render);
  }

  render();
</script>
</body>
</html>
