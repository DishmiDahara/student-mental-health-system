<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Blooming Gardens</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background: #022c22; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: white; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 16px; overflow: hidden;
  }
  .header { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 440px; margin-bottom: 12px; }
  .title { font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 8px; color: #a7f3d0; }
  .garden-grid {
    width: 360px; height: 360px; background: #064e3b; border-radius: 24px;
    border: 3px solid #059669; display: grid; grid-template-columns: repeat(5, 1fr);
    padding: 12px; gap: 8px; box-shadow: 0 25px 50px rgba(0,0,0,0.6);
  }
  .flower-tile {
    background: #042f2e; border-radius: 12px; display: flex; align-items: center;
    justify-content: center; font-size: 32px; cursor: pointer; transition: transform .15s ease;
  }
  .flower-tile:hover { transform: scale(1.15); filter: drop-shadow(0 0 10px #34d399); }
  .tip { margin-top: 14px; font-size: 13.5px; color: #6ee7b7; font-weight: 600; text-align: center; }
</style>
</head>
<body>
<div class="header">
  <div class="title"><span>🌸</span> Blooming Gardens</div>
  <div style="font-size:13px; color:#a7f3d0; font-weight:800;" id="score">Blooms: 0</div>
</div>
<div class="garden-grid" id="grid"></div>
<div class="tip" id="tip">Tap matching flowers to trigger blossoming garden cascades!</div>

<script>
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function bloomSound(f = 520) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.frequency.setValueAtTime(f, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(f * 1.5, audioCtx.currentTime + 0.15);
    g.gain.setValueAtTime(0.2, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.15);
  }

  const FLOWERS = ['🌹', '🌻', '🌷', '🪻', '🌼'];
  let board = Array(25).fill(null).map(() => FLOWERS[Math.floor(Math.random() * FLOWERS.length)]);
  let score = 0;

  function render() {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    board.forEach((flower, i) => {
      const el = document.createElement('div');
      el.className = 'flower-tile';
      el.textContent = flower || '🌱';
      el.onclick = () => tapFlower(i);
      grid.appendChild(el);
    });
  }

  function tapFlower(idx) {
    const type = board[idx];
    if (!type) return;
    bloomSound(440);
    // Clear all same type
    let count = 0;
    board = board.map(f => {
      if (f === type) { count++; return FLOWERS[Math.floor(Math.random() * FLOWERS.length)]; }
      return f;
    });
    score += count;
    document.getElementById('score').textContent = `Blooms: ${score}`;
    render();
    if (score >= 15) {
      document.getElementById('tip').innerHTML = '<span style="color:#a7f3d0; font-weight:800; font-size:15px;">🦋 Enchanting floral estate in full bloom! Joyful calm.</span>';
    }
  }

  render();
</script>
</body>
</html>
