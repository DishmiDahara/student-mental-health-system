<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Idle Sea Park 3D</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background: #082f49; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: white; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 16px; overflow: hidden;
  }
  .header { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 440px; margin-bottom: 12px; }
  .title { font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 8px; color: #38bdf8; }
  .lagoon-box {
    position: relative; width: 380px; height: 360px;
    background: radial-gradient(circle at 50% 20%, #0284c7 0%, #0369a1 60%, #082f49 100%);
    border-radius: 28px; border: 4px solid #38bdf8; box-shadow: 0 25px 50px rgba(0,0,0,0.6);
    overflow: hidden;
  }
  canvas { width: 100%; height: 100%; cursor: pointer; }
  .controls { display: flex; gap: 10px; width: 100%; max-width: 380px; margin-top: 14px; }
  .btn {
    flex: 1; background: #0284c7; border: none; color: white; padding: 12px;
    border-radius: 14px; font-size: 13.5px; font-weight: 800; cursor: pointer;
    box-shadow: 0 4px 12px rgba(2,132,199,0.3); transition: transform .1s;
  }
  .btn:active { transform: scale(0.96); }
  .tip { margin-top: 12px; font-size: 13px; color: #bae6fd; font-weight: 600; text-align: center; }
</style>
</head>
<body>
<div class="header">
  <div class="title"><span>🐬</span> Idle Sea Park 3D</div>
  <div style="font-size:13px; color:#38bdf8; font-weight:800;" id="lagoonState">Dolphin Bay Sanctuary</div>
</div>
<div class="lagoon-box">
  <canvas id="cvs" width="380" height="360"></canvas>
</div>
<div class="controls">
  <button class="btn" onclick="jumpDolphin()"><span>🐬</span> Dolphin Jump</button>
  <button class="btn" style="background:#059669;" onclick="addTurtle()"><span>🐢</span> Sea Turtle</button>
</div>
<div class="tip" id="tip">Tap 'Dolphin Jump' to watch dolphins leap gracefully across the turquoise lagoon!</div>

<script>
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function splashAudio() {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.frequency.setValueAtTime(450, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(700, audioCtx.currentTime + 0.18);
    g.gain.setValueAtTime(0.2, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.18);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.18);
  }

  const cvs = document.getElementById('cvs');
  const ctx = cvs.getContext('2d');

  let dolphin = { x: 190, y: 220, vy: 0, jumping: false };
  let creatures = [{ x: 80, y: 150, icon: '🐢' }, { x: 280, y: 280, icon: '🪼' }];

  function jumpDolphin() {
    if (!dolphin.jumping) {
      splashAudio();
      dolphin.jumping = true;
      dolphin.vy = -12;
    }
  }

  function addTurtle() {
    splashAudio();
    creatures.push({ x: 50 + Math.random() * 280, y: 80 + Math.random() * 200, icon: '🐢' });
  }

  function render() {
    ctx.clearRect(0, 0, cvs.width, cvs.height);

    // Coral floor
    ctx.font = '36px sans-serif';
    ctx.fillText('🪸', 40, 340);
    ctx.fillText('🪸', 290, 340);

    // Other creatures
    creatures.forEach(c => {
      ctx.font = '34px sans-serif';
      ctx.fillText(c.icon, c.x, c.y);
    });

    // Dolphin
    if (dolphin.jumping) {
      dolphin.vy += 0.4;
      dolphin.y += dolphin.vy;
      if (dolphin.y >= 220) {
        dolphin.y = 220;
        dolphin.jumping = false;
        splashAudio();
        document.getElementById('tip').innerHTML = '<span style="color:#bae6fd; font-weight:800; font-size:15px;">🌊 Majestic splash! Sea park visitors and creatures rejoice!</span>';
      }
    }

    ctx.font = '48px sans-serif';
    ctx.fillText('🐬', dolphin.x - 24, dolphin.y + 16);

    requestAnimationFrame(render);
  }

  render();
</script>
</body>
</html>
