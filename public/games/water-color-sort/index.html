<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Water Color Sort</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: white; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 16px; overflow: hidden;
  }
  .header { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 440px; margin-bottom: 24px; }
  .title { font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 8px; color: #38bdf8; }
  .tubes-container { display: flex; gap: 24px; justify-content: center; align-items: flex-end; height: 260px; margin-bottom: 24px; }
  .tube {
    width: 60px; height: 200px; border: 4px solid rgba(255,255,255,0.7); border-top: none;
    border-radius: 0 0 30px 30px; position: relative; display: flex; flex-direction: column-reverse;
    overflow: hidden; background: rgba(255,255,255,0.06); box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    cursor: pointer; transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .tube:hover { transform: translateY(-8px); border-color: white; }
  .tube.selected { transform: translateY(-24px); border-color: #38bdf8; box-shadow: 0 15px 30px rgba(56,189,248,0.4); }
  .liquid-segment {
    width: 100%; height: 25%; transition: height 0.3s ease;
  }
  .btn-bar { display: flex; gap: 10px; }
  .btn {
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white;
    padding: 8px 18px; border-radius: 12px; font-size: 13px; font-weight: 700; cursor: pointer;
  }
  .btn:hover { background: rgba(255,255,255,0.2); }
  .tip { margin-top: 14px; font-size: 13px; color: #94a3b8; font-weight: 600; text-align: center; }
</style>
</head>
<body>
<div class="header">
  <div class="title"><span>🧪</span> Water Color Sort</div>
  <div style="font-size:13px; color:#38bdf8; font-weight:700;">Relaxing Mode</div>
</div>
<div class="tubes-container" id="tubesBox"></div>
<div class="btn-bar">
  <button class="btn" onclick="initGame()">🔄 Restart Level</button>
</div>
<div class="tip" id="tip">Tap a test tube to pick it up, then tap another to pour matching colors</div>

<script>
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function pourSound() {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.frequency.setValueAtTime(320, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(480, audioCtx.currentTime + 0.18);
    g.gain.setValueAtTime(0.2, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.18);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.18);
  }

  const COLORS = {
    R: '#f43f5e', // Rose
    B: '#38bdf8', // Sky Blue
    G: '#10b981', // Emerald
    P: '#a855f7'  // Purple
  };

  let tubes = [];
  let selectedTube = null;

  function initGame() {
    tubes = [
      ['R', 'B', 'G', 'P'],
      ['P', 'G', 'R', 'B'],
      ['B', 'R', 'P', 'G'],
      [] // Empty tube
    ];
    selectedTube = null;
    document.getElementById('tip').textContent = 'Tap a test tube to pick it up, then tap another to pour matching colors';
    render();
  }

  function render() {
    const box = document.getElementById('tubesBox');
    box.innerHTML = '';
    tubes.forEach((t, i) => {
      const el = document.createElement('div');
      el.className = 'tube' + (selectedTube === i ? ' selected' : '');
      el.onclick = () => handleTubeClick(i);
      t.forEach(c => {
        const seg = document.createElement('div');
        seg.className = 'liquid-segment';
        seg.style.background = COLORS[c];
        el.appendChild(seg);
      });
      box.appendChild(el);
    });
  }

  function handleTubeClick(idx) {
    if (selectedTube === null) {
      if (tubes[idx].length > 0) {
        selectedTube = idx;
        render();
      }
    } else if (selectedTube === idx) {
      selectedTube = null;
      render();
    } else {
      // Attempt pour from selectedTube to idx
      const src = tubes[selectedTube];
      const dst = tubes[idx];
      if (dst.length < 4) {
        const color = src[src.length - 1];
        if (dst.length === 0 || dst[dst.length - 1] === color) {
          src.pop();
          dst.push(color);
          pourSound();
          selectedTube = null;
          render();
          checkWin();
          return;
        }
      }
      selectedTube = null;
      render();
    }
  }

  function checkWin() {
    let win = true;
    tubes.forEach(t => {
      if (t.length > 0 && t.length < 4) win = false;
      if (t.length === 4) {
        const c = t[0];
        if (!t.every(x => x === c)) win = false;
      }
    });
    if (win) {
      document.getElementById('tip').innerHTML = '<span style="color:#10b981; font-weight:800;">🎉 Pure harmony! All liquids cleanly sorted!</span>';
    }
  }

  initGame();
</script>
</body>
</html>
