<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Home Design: Decorate House</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: white; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 16px; overflow: hidden;
  }
  .header { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 440px; margin-bottom: 12px; }
  .title { font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 8px; color: #f59e0b; }
  .room-view {
    position: relative; width: 380px; height: 360px; background: #f8fafc;
    border-radius: 28px; border: 4px solid #cbd5e1; box-shadow: 0 25px 50px rgba(0,0,0,0.6);
    overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
  }
  .wallpaper {
    position: absolute; inset: 0; width: 100%; height: 65%;
    background: linear-gradient(180deg, #e2e8f0 0%, #cbd5e1 100%);
    border-bottom: 4px solid #94a3b8; transition: background .3s;
  }
  .floor { width: 100%; height: 35%; background: #d97706; border-top: 6px solid #b45309; }
  .furniture-spot {
    position: absolute; font-size: 50px; cursor: pointer; transition: transform .2s ease;
  }
  .furniture-spot:hover { transform: scale(1.15); }
  .catalog {
    display: flex; gap: 10px; width: 100%; max-width: 380px; margin-top: 14px;
    background: rgba(255,255,255,0.08); padding: 8px 14px; border-radius: 18px; border: 1px solid rgba(255,255,255,0.15);
  }
  .c-btn {
    flex: 1; background: #334155; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px;
    padding: 8px 4px; font-size: 24px; cursor: pointer; transition: transform .1s;
    display: flex; align-items: center; justify-content: center;
  }
  .c-btn:active { transform: scale(0.94); }
  .tip { margin-top: 12px; font-size: 13.5px; color: #cbd5e1; font-weight: 600; text-align: center; }
</style>
</head>
<body>
<div class="header">
  <div class="title"><span>🏡</span> Home Design Studio</div>
  <div style="font-size:13px; color:#f59e0b; font-weight:800;" id="styleText">Modern Penthouse</div>
</div>
<div class="room-view" id="room">
  <div class="wallpaper" id="wall">
    <div style="position:absolute; top:20px; left:40px; font-size:36px;">🖼️</div>
    <div style="position:absolute; top:15px; right:40px; font-size:40px;">🪟</div>
  </div>
  <div class="floor"></div>
  <div class="furniture-spot" id="sofa" style="bottom:40px; left:60px;" onclick="cycleSofa()">🛋️</div>
  <div class="furniture-spot" id="plant" style="bottom:45px; right:60px;" onclick="cyclePlant()">🪴</div>
  <div class="furniture-spot" id="lamp" style="top:90px; left:160px;" onclick="cycleLamp()">💡</div>
</div>
<div class="catalog">
  <button class="c-btn" onclick="cycleWall()">🎨</button>
  <button class="c-btn" onclick="cycleSofa()">🛋️</button>
  <button class="c-btn" onclick="cyclePlant()">🪴</button>
  <button class="c-btn" onclick="cycleLamp()">💡</button>
</div>
<div class="tip" id="tip">Tap the wallpaper and furniture icons to customize your luxury room interior!</div>

<script>
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function chimeAudio(f = 540) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.frequency.setValueAtTime(f, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.12);
    g.gain.setValueAtTime(0.2, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.12);
  }

  const WALLS = [
    'linear-gradient(180deg, #fef3c7 0%, #fed7aa 100%)',
    'linear-gradient(180deg, #dcfce7 0%, #bbf7d0 100%)',
    'linear-gradient(180deg, #e0f2fe 0%, #bae6fd 100%)',
    'linear-gradient(180deg, #f3e8ff 0%, #e9d5ff 100%)'
  ];
  let curWall = 0;
  function cycleWall() {
    chimeAudio(480);
    curWall = (curWall + 1) % WALLS.length;
    document.getElementById('wall').style.background = WALLS[curWall];
  }

  const SOFAS = ['🛋️', '🪑', '🛏️'];
  let curSofa = 0;
  function cycleSofa() {
    chimeAudio(560);
    curSofa = (curSofa + 1) % SOFAS.length;
    document.getElementById('sofa').textContent = SOFAS[curSofa];
  }

  const PLANTS = ['🪴', '🌵', '🌿'];
  let curPlant = 0;
  function cyclePlant() {
    chimeAudio(640);
    curPlant = (curPlant + 1) % PLANTS.length;
    document.getElementById('plant').textContent = PLANTS[curPlant];
  }

  const LAMPS = ['💡', '🏮', '🕯️'];
  let curLamp = 0;
  function cycleLamp() {
    chimeAudio(720);
    curLamp = (curLamp + 1) % LAMPS.length;
    document.getElementById('lamp').textContent = LAMPS[curLamp];
    document.getElementById('tip').innerHTML = '<span style="color:#f59e0b; font-weight:800; font-size:15px;">✨ Elegant luxury aesthetics! Pure creative satisfaction.</span>';
  }
</script>
</body>
</html>
