<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Zen Sand Garden - Karesansui</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #26211a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #container { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; }
    #canvas-wrap { position: relative; flex: 1; margin: 12px; border-radius: 16px; overflow: hidden; box-shadow: 0 15px 35px rgba(0,0,0,0.5), inset 0 0 0 8px #4a3b2c; background: #e8ded1; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
    #sandCanvas { z-index: 1; }
    #objectCanvas { z-index: 2; pointer-events: none; }
    .toolbar { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; gap: 8px; background: rgba(30, 24, 18, 0.88); backdrop-filter: blur(8px); padding: 8px 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.15); box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
    .tool-btn { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: #f5eedb; padding: 7px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all 0.15s; }
    .tool-btn:hover { background: rgba(255,255,255,0.18); transform: translateY(-1px); }
    .tool-btn.active { background: #d97706; border-color: #f59e0b; color: white; box-shadow: 0 2px 10px rgba(217,119,6,0.4); }
    .header-tip { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); z-index: 10; color: #a89f91; font-size: 13px; letter-spacing: 0.05em; background: rgba(20, 16, 12, 0.7); padding: 5px 14px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.08); pointer-events: none; }
  </style>
</head>
<body>
  <div id="container">
    <div class="header-tip">🪨 Drag to rake sand · Touch stones to arrange · Breathe softly</div>
    <div id="canvas-wrap">
      <canvas id="sandCanvas"></canvas>
      <canvas id="objectCanvas"></canvas>
    </div>
    <div class="toolbar">
      <button class="tool-btn active" id="btnRake" onclick="setTool('rake')">🌾 5-Tine Rake</button>
      <button class="tool-btn" id="btnSingle" onclick="setTool('single')">✏️ Fine Rake</button>
      <button class="tool-btn" id="btnSmooth" onclick="setTool('smooth')">🧹 Smooth</button>
      <button class="tool-btn" id="btnAddStone" onclick="addStone()">🪨 Add Stone</button>
      <button class="tool-btn" onclick="resetSand()">✨ Rake All</button>
    </div>
  </div>

  <script>
    const sandCanvas = document.getElementById('sandCanvas');
    const objectCanvas = document.getElementById('objectCanvas');
    const sCtx = sandCanvas.getContext('2d');
    const oCtx = objectCanvas.getContext('2d');

    let currentTool = 'rake';
    let isDrawing = false;
    let lastX = 0, lastY = 0;
    let draggedStone = null;
    let dragOffset = { x: 0, y: 0 };

    // Audio synthesis for realistic dry sand raking
    let audioCtx = null;
    let noiseNode = null;
    let noiseFilter = null;
    let noiseGain = null;

    function initAudio() {
      if (audioCtx) return;
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
        const bufferSize = audioCtx.sampleRate * 2;
        const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          output[i] = Math.random() * 2 - 1;
        }
        const whiteNoise = audioCtx.createBufferSource();
        whiteNoise.buffer = noiseBuffer;
        whiteNoise.loop = true;

        noiseFilter = audioCtx.createBiquadFilter();
        noiseFilter.type = 'bandpass';
        noiseFilter.frequency.value = 1100;
        noiseFilter.Q.value = 2.5;

        noiseGain = audioCtx.createGain();
        noiseGain.gain.setValueAtTime(0, audioCtx.currentTime);

        whiteNoise.connect(noiseFilter);
        noiseFilter.connect(noiseGain);
        noiseGain.connect(audioCtx.destination);
        whiteNoise.start();
      } catch (e) {}
    }

    function playRakeSound(speed) {
      if (!audioCtx || !noiseGain) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const volume = Math.min(0.25, Math.max(0.02, speed * 0.015));
      noiseGain.gain.setTargetAtTime(volume, audioCtx.currentTime, 0.04);
    }

    function stopRakeSound() {
      if (!audioCtx || !noiseGain) return;
      noiseGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.08);
    }

    // Meditation Stones
    let stones = [
      { x: 0.3, y: 0.4, rx: 42, ry: 32, rot: 0.3, color: '#383633' },
      { x: 0.36, y: 0.46, rx: 24, ry: 20, rot: -0.2, color: '#45423e' },
      { x: 0.7, y: 0.65, rx: 48, ry: 36, rot: -0.4, color: '#2e2c29' },
      { x: 0.65, y: 0.60, rx: 28, ry: 22, rot: 0.6, color: '#4a4641' }
    ];

    function resize() {
      const rect = sandCanvas.parentElement.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      sandCanvas.width = rect.width * dpr;
      sandCanvas.height = rect.height * dpr;
      objectCanvas.width = rect.width * dpr;
      objectCanvas.height = rect.height * dpr;
      sCtx.scale(dpr, dpr);
      oCtx.scale(dpr, dpr);
      renderBaseSand();
      renderStones();
    }

    function renderBaseSand() {
      const w = sandCanvas.width / (window.devicePixelRatio || 1);
      const h = sandCanvas.height / (window.devicePixelRatio || 1);
      
      // Warm mineral sand tone
      sCtx.fillStyle = '#e8dec8';
      sCtx.fillRect(0, 0, w, h);

      // Fine procedural sand grain
      const grainImg = sCtx.createImageData(w, h);
      const data = grainImg.data;
      for (let i = 0; i < data.length; i += 4) {
        const n = (Math.random() - 0.5) * 16;
        data[i] = 232 + n;
        data[i+1] = 222 + n;
        data[i+2] = 200 + n;
        data[i+3] = 40;
      }
      sCtx.putImageData(grainImg, 0, 0);

      // Initial meditative horizontal ripples
      sCtx.strokeStyle = 'rgba(175, 155, 125, 0.45)';
      sCtx.lineWidth = 3;
      for (let y = 20; y < h; y += 22) {
        sCtx.beginPath();
        sCtx.moveTo(0, y);
        sCtx.lineTo(w, y);
        sCtx.stroke();
      }

      // Draw initial ripple rings around stones
      stones.forEach(s => {
        const sx = s.x * w;
        const sy = s.y * h;
        for (let r = 16; r <= 60; r += 14) {
          sCtx.beginPath();
          sCtx.ellipse(sx, sy, s.rx + r, s.ry + r, s.rot, 0, Math.PI * 2);
          sCtx.strokeStyle = 'rgba(165, 145, 115, 0.45)';
          sCtx.lineWidth = 3.5;
          sCtx.stroke();
        }
      });
    }

    function renderStones() {
      const w = objectCanvas.width / (window.devicePixelRatio || 1);
      const h = objectCanvas.height / (window.devicePixelRatio || 1);
      oCtx.clearRect(0, 0, w, h);

      stones.forEach(s => {
        const sx = s.x * w;
        const sy = s.y * h;

        // Soft drop shadow in sand
        oCtx.save();
        oCtx.beginPath();
        oCtx.ellipse(sx + 5, sy + 7, s.rx + 6, s.ry + 6, s.rot, 0, Math.PI * 2);
        oCtx.fillStyle = 'rgba(50, 40, 30, 0.35)';
        oCtx.filter = 'blur(6px)';
        oCtx.fill();
        oCtx.restore();

        // Stone base
        oCtx.save();
        oCtx.beginPath();
        oCtx.ellipse(sx, sy, s.rx, s.ry, s.rot, 0, Math.PI * 2);
        oCtx.fillStyle = s.color;
        oCtx.fill();

        // Natural moss accent
        oCtx.beginPath();
        oCtx.ellipse(sx - s.rx * 0.25, sy - s.ry * 0.25, s.rx * 0.45, s.ry * 0.45, s.rot, 0, Math.PI * 2);
        oCtx.fillStyle = 'rgba(65, 95, 45, 0.35)';
        oCtx.fill();

        // Top highlight
        oCtx.beginPath();
        oCtx.ellipse(sx - s.rx * 0.3, sy - s.ry * 0.35, s.rx * 0.6, s.ry * 0.4, s.rot, 0, Math.PI * 2);
        oCtx.fillStyle = 'rgba(255, 255, 255, 0.12)';
        oCtx.fill();

        oCtx.restore();
      });
    }

    function rakeSand(x1, y1, x2, y2) {
      const dx = x2 - x1;
      const dy = y2 - y1;
      const dist = Math.hypot(dx, dy);
      if (dist < 1) return;

      playRakeSound(dist);

      if (currentTool === 'smooth') {
        sCtx.save();
        sCtx.lineCap = 'round';
        sCtx.strokeStyle = '#e8dec8';
        sCtx.lineWidth = 36;
        sCtx.beginPath();
        sCtx.moveTo(x1, y1);
        sCtx.lineTo(x2, y2);
        sCtx.stroke();
        sCtx.restore();
        return;
      }

      // Normal angle for multi-tine rake
      const nx = -dy / dist;
      const ny = dx / dist;

      const tines = currentTool === 'rake' ? [-20, -10, 0, 10, 20] : [0];

      sCtx.save();
      sCtx.lineCap = 'round';

      tines.forEach(offset => {
        const ox = nx * offset;
        const oy = ny * offset;

        // Shadow trench
        sCtx.strokeStyle = 'rgba(160, 140, 110, 0.65)';
        sCtx.lineWidth = 3.5;
        sCtx.beginPath();
        sCtx.moveTo(x1 + ox, y1 + oy);
        sCtx.lineTo(x2 + ox, y2 + oy);
        sCtx.stroke();

        // Sand crest highlight
        sCtx.strokeStyle = 'rgba(255, 250, 240, 0.4)';
        sCtx.lineWidth = 2;
        sCtx.beginPath();
        sCtx.moveTo(x1 + ox + nx * 1.5, y1 + oy + ny * 1.5);
        sCtx.lineTo(x2 + ox + nx * 1.5, y2 + oy + ny * 1.5);
        sCtx.stroke();
      });

      sCtx.restore();
    }

    function getCoords(e) {
      const rect = sandCanvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function hitTestStone(x, y) {
      const w = sandCanvas.width / (window.devicePixelRatio || 1);
      const h = sandCanvas.height / (window.devicePixelRatio || 1);
      for (let i = stones.length - 1; i >= 0; i--) {
        const s = stones[i];
        const sx = s.x * w;
        const sy = s.y * h;
        if (Math.hypot(x - sx, y - sy) < s.rx * 1.1) {
          return { stone: s, index: i, sx, sy };
        }
      }
      return null;
    }

    sandCanvas.addEventListener('pointerdown', e => {
      initAudio();
      const pt = getCoords(e);
      const hit = hitTestStone(pt.x, pt.y);
      if (hit) {
        draggedStone = hit.stone;
        const w = sandCanvas.width / (window.devicePixelRatio || 1);
        const h = sandCanvas.height / (window.devicePixelRatio || 1);
        dragOffset = { x: pt.x - draggedStone.x * w, y: pt.y - draggedStone.y * h };
      } else {
        isDrawing = true;
        lastX = pt.x;
        lastY = pt.y;
      }
    });

    window.addEventListener('pointermove', e => {
      const pt = getCoords(e);
      const w = sandCanvas.width / (window.devicePixelRatio || 1);
      const h = sandCanvas.height / (window.devicePixelRatio || 1);

      if (draggedStone) {
        draggedStone.x = Math.max(0.08, Math.min(0.92, (pt.x - dragOffset.x) / w));
        draggedStone.y = Math.max(0.08, Math.min(0.92, (pt.y - dragOffset.y) / h));
        renderStones();
        return;
      }

      if (isDrawing) {
        rakeSand(lastX, lastY, pt.x, pt.y);
        lastX = pt.x;
        lastY = pt.y;
      }
    });

    window.addEventListener('pointerup', () => {
      isDrawing = false;
      draggedStone = null;
      stopRakeSound();
    });

    function setTool(tool) {
      currentTool = tool;
      document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
      if (tool === 'rake') document.getElementById('btnRake').classList.add('active');
      if (tool === 'single') document.getElementById('btnSingle').classList.add('active');
      if (tool === 'smooth') document.getElementById('btnSmooth').classList.add('active');
    }

    function addStone() {
      const colors = ['#2e2c29', '#3d3a36', '#48443f', '#242321', '#54504a'];
      stones.push({
        x: 0.4 + Math.random() * 0.2,
        y: 0.4 + Math.random() * 0.2,
        rx: 24 + Math.random() * 26,
        ry: 18 + Math.random() * 18,
        rot: Math.random() * Math.PI,
        color: colors[Math.floor(Math.random() * colors.length)]
      });
      renderStones();
    }

    function resetSand() {
      renderBaseSand();
      renderStones();
    }

    window.addEventListener('resize', resize);
    window.addEventListener('DOMContentLoaded', resize);
    setTimeout(resize, 50);
  </script>
</body>
</html>
