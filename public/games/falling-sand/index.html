<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Falling Sand Physics</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; }
    #canvas-wrap { position: relative; flex: 1; margin: 12px; border-radius: 16px; overflow: hidden; background: #000; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    canvas { width: 100%; height: 100%; image-rendering: pixelated; touch-action: none; display: block; }
    .toolbar { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; padding: 12px 16px; background: rgba(30, 41, 59, 0.85); backdrop-filter: blur(8px); border-top: 1px solid rgba(255,255,255,0.08); }
    .el-btn { padding: 6px 14px; border-radius: 999px; font-size: 13px; font-weight: 700; border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.06); color: #cbd5e1; cursor: pointer; display: flex; align-items: center; gap: 5px; transition: all 0.15s; }
    .el-btn:hover { background: rgba(255,255,255,0.15); transform: translateY(-1px); }
    .el-btn.active { color: white; border-color: white; box-shadow: 0 0 12px rgba(255,255,255,0.25); }
    .btn-sand.active { background: #d97706; border-color: #f59e0b; }
    .btn-water.active { background: #0284c7; border-color: #38bdf8; }
    .btn-plant.active { background: #16a34a; border-color: #4ade80; }
    .btn-fire.active { background: #dc2626; border-color: #f87171; }
    .btn-stone.active { background: #64748b; border-color: #94a3b8; }
    .btn-acid.active { background: #9333ea; border-color: #c084fc; }
  </style>
</head>
<body>
  <div id="canvas-wrap">
    <canvas id="sandCanvas"></canvas>
  </div>
  <div class="toolbar">
    <button class="el-btn btn-sand active" onclick="setElement('sand')">⏳ Sand</button>
    <button class="el-btn btn-water" onclick="setElement('water')">💧 Water</button>
    <button class="el-btn btn-plant" onclick="setElement('plant')">🌱 Plant</button>
    <button class="el-btn btn-fire" onclick="setElement('fire')">🔥 Fire</button>
    <button class="el-btn btn-stone" onclick="setElement('stone')">🪨 Stone</button>
    <button class="el-btn btn-acid" onclick="setElement('acid')">🧪 Acid</button>
    <button class="el-btn" onclick="clearGrid()">🧹 Clear</button>
  </div>

  <script>
    const canvas = document.getElementById('sandCanvas');
    const ctx = canvas.getContext('2d');

    const W = 160;
    const H = 130;
    canvas.width = W;
    canvas.height = H;

    // Elements definition
    const EMPTY = 0;
    const SAND = 1;
    const WATER = 2;
    const PLANT = 3;
    const FIRE = 4;
    const STONE = 5;
    const ACID = 6;
    const STEAM = 7;

    const colors = {
      [EMPTY]: [15, 23, 42],
      [SAND]: [225, 175, 75],
      [WATER]: [56, 189, 248],
      [PLANT]: [74, 222, 128],
      [FIRE]: [248, 113, 113],
      [STONE]: [148, 163, 184],
      [ACID]: [192, 132, 252],
      [STEAM]: [226, 232, 240]
    };

    let grid = new Uint8Array(W * H);
    let life = new Uint8Array(W * H);
    let imgData = ctx.createImageData(W, H);

    let currentEl = SAND;
    let isDrawing = false;
    let brushRadius = 3;

    function getIdx(x, y) { return y * W + x; }

    function setElement(name) {
      document.querySelectorAll('.el-btn').forEach(b => b.classList.remove('active'));
      const map = { sand: SAND, water: WATER, plant: PLANT, fire: FIRE, stone: STONE, acid: ACID };
      currentEl = map[name] || SAND;
      const btn = document.querySelector(`.btn-${name}`);
      if (btn) btn.classList.add('active');
    }

    function clearGrid() {
      grid.fill(EMPTY);
      life.fill(0);
    }

    function addParticles(cx, cy, type) {
      for (let dy = -brushRadius; dy <= brushRadius; dy++) {
        for (let dx = -brushRadius; dx <= brushRadius; dx++) {
          if (dx * dx + dy * dy <= brushRadius * brushRadius) {
            const x = cx + dx;
            const y = cy + dy;
            if (x >= 0 && x < W && y >= 0 && y < H) {
              const idx = getIdx(x, y);
              if (grid[idx] !== STONE || type === EMPTY) {
                grid[idx] = type;
                life[idx] = type === FIRE ? 35 + Math.random() * 20 : 0;
              }
            }
          }
        }
      }
    }

    function step() {
      // Traverse bottom-up to prevent double steps
      for (let y = H - 1; y >= 0; y--) {
        const leftToRight = Math.random() > 0.5;
        const startX = leftToRight ? 0 : W - 1;
        const endX = leftToRight ? W : -1;
        const stepX = leftToRight ? 1 : -1;

        for (let x = startX; x !== endX; x += stepX) {
          const idx = getIdx(x, y);
          const type = grid[idx];

          if (type === EMPTY || type === STONE) continue;

          // Sand
          if (type === SAND) {
            if (y + 1 < H) {
              const b = getIdx(x, y + 1);
              if (grid[b] === EMPTY || grid[b] === WATER) {
                const swap = grid[b];
                grid[b] = SAND;
                grid[idx] = swap;
              } else {
                const dir = Math.random() > 0.5 ? 1 : -1;
                const bl = getIdx(x + dir, y + 1);
                if (x + dir >= 0 && x + dir < W && (grid[bl] === EMPTY || grid[bl] === WATER)) {
                  const swap = grid[bl];
                  grid[bl] = SAND;
                  grid[idx] = swap;
                }
              }
            }
          }

          // Water
          else if (type === WATER) {
            if (y + 1 < H && grid[getIdx(x, y + 1)] === EMPTY) {
              grid[getIdx(x, y + 1)] = WATER;
              grid[idx] = EMPTY;
            } else {
              const dir = Math.random() > 0.5 ? 1 : -1;
              if (x + dir >= 0 && x + dir < W && grid[getIdx(x + dir, y)] === EMPTY) {
                grid[getIdx(x + dir, y)] = WATER;
                grid[idx] = EMPTY;
              }
            }
          }

          // Fire
          else if (type === FIRE) {
            life[idx]--;
            if (life[idx] <= 0) {
              grid[idx] = EMPTY;
              continue;
            }
            // Fire moves up
            if (y - 1 >= 0 && Math.random() < 0.6) {
              const up = getIdx(x, y - 1);
              if (grid[up] === PLANT) {
                grid[up] = FIRE;
                life[up] = 40;
              } else if (grid[up] === WATER) {
                grid[up] = STEAM;
                grid[idx] = EMPTY;
              }
            }
          }

          // Plant growth
          else if (type === PLANT) {
            // Absorb adjacent water and sprout
            const neighbors = [
              [x, y - 1], [x + 1, y], [x - 1, y], [x, y + 1]
            ];
            for (let [nx, ny] of neighbors) {
              if (nx >= 0 && nx < W && ny >= 0 && ny < H) {
                const nidx = getIdx(nx, ny);
                if (grid[nidx] === WATER && Math.random() < 0.12) {
                  grid[nidx] = PLANT;
                }
              }
            }
          }

          // Acid dissolves everything except glass/stone
          else if (type === ACID) {
            if (y + 1 < H) {
              const b = getIdx(x, y + 1);
              if (grid[b] !== EMPTY && grid[b] !== STONE && grid[b] !== ACID) {
                grid[b] = EMPTY;
                grid[idx] = EMPTY;
              } else if (grid[b] === EMPTY) {
                grid[b] = ACID;
                grid[idx] = EMPTY;
              }
            }
          }

          // Steam rises
          else if (type === STEAM) {
            if (y - 1 >= 0) {
              const u = getIdx(x, y - 1);
              if (grid[u] === EMPTY) {
                grid[u] = STEAM;
                grid[idx] = EMPTY;
              }
            } else {
              grid[idx] = EMPTY;
            }
          }
        }
      }
    }

    function render() {
      const data = imgData.data;
      for (let i = 0; i < W * H; i++) {
        const type = grid[i];
        const base = colors[type] || colors[EMPTY];
        const p = i * 4;
        data[p] = base[0];
        data[p + 1] = base[1];
        data[p + 2] = base[2];
        data[p + 3] = 255;
      }
      ctx.putImageData(imgData, 0, 0);
    }

    function loop() {
      step();
      render();
      requestAnimationFrame(loop);
    }
    loop();

    function drawPointer(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const x = Math.floor(((clientX - rect.left) / rect.width) * W);
      const y = Math.floor(((clientY - rect.top) / rect.height) * H);
      addParticles(x, y, currentEl);
    }

    canvas.addEventListener('pointerdown', e => {
      isDrawing = true;
      drawPointer(e);
    });

    window.addEventListener('pointermove', e => {
      if (isDrawing) drawPointer(e);
    });

    window.addEventListener('pointerup', () => { isDrawing = false; });
  </script>
</body>
</html>
