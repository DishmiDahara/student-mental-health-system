<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Sprout Valley: Cozy Farm</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background: #064e3b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: white; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 16px; overflow: hidden;
  }
  .header { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 440px; margin-bottom: 12px; }
  .title { font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 8px; color: #a7f3d0; }
  .canvas-box {
    position: relative; width: 380px; height: 360px; background: #15803d;
    border-radius: 28px; border: 4px solid #059669; box-shadow: 0 25px 50px rgba(0,0,0,0.6);
    overflow: hidden;
  }
  canvas { width: 100%; height: 100%; cursor: pointer; }
  .controls { display: flex; gap: 10px; width: 100%; max-width: 380px; margin-top: 14px; }
  .btn {
    flex: 1; background: #059669; border: none; color: white; padding: 12px;
    border-radius: 14px; font-size: 13.5px; font-weight: 800; cursor: pointer;
    box-shadow: 0 4px 12px rgba(5,150,105,0.4); transition: transform .1s;
  }
  .btn:active { transform: scale(0.96); }
  .tip { margin-top: 12px; font-size: 13px; color: #6ee7b7; font-weight: 600; text-align: center; }
</style>
</head>
<body>
<div class="header">
  <div class="title"><span>🌾</span> Sprout Valley</div>
  <div style="font-size:13px; color:#a7f3d0; font-weight:800;" id="cropCount">0 Harvested</div>
</div>
<div class="canvas-box">
  <canvas id="cvs" width="380" height="360"></canvas>
</div>
<div class="controls">
  <button class="btn" onclick="plantCrop()"><span>🌱</span> Plant Berry</button>
  <button class="btn" style="background:#0284c7;" onclick="waterCrops()"><span>💧</span> Water All</button>
  <button class="btn" style="background:#d97706;" onclick="harvestAll()"><span>🍓</span> Harvest</button>
</div>
<div class="tip" id="tip">Help Nico the cat plant sweet strawberries and water them on the seaside farm!</div>

<script>
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function bellSound() {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.frequency.setValueAtTime(580, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.15);
    g.gain.setValueAtTime(0.2, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.15);
  }

  const cvs = document.getElementById('cvs');
  const ctx = cvs.getContext('2d');

  let plots = [
    { x: 80, y: 140, state: 'empty' },
    { x: 190, y: 140, state: 'empty' },
    { x: 300, y: 140, state: 'empty' },
    { x: 80, y: 240, state: 'empty' },
    { x: 190, y: 240, state: 'empty' },
    { x: 300, y: 240, state: 'empty' }
  ];

  let harvested = 0;

  function plantCrop() {
    bellSound();
    plots.forEach(p => { if (p.state === 'empty') p.state = 'sprout'; });
  }

  function waterCrops() {
    bellSound();
    plots.forEach(p => { if (p.state === 'sprout') p.state = 'ripe'; });
  }

  function harvestAll() {
    let gained = 0;
    plots.forEach(p => {
      if (p.state === 'ripe') {
        p.state = 'empty';
        gained++;
      }
    });
    if (gained > 0) {
      bellSound();
      harvested += gained;
      document.getElementById('cropCount').textContent = `${harvested} Harvested`;
      document.getElementById('tip').innerHTML = '<span style="color:#a7f3d0; font-weight:800; font-size:15px;">🍓 Delicious sweet berries! Nico purrs contentedly.</span>';
    }
  }

  function render() {
    ctx.clearRect(0, 0, cvs.width, cvs.height);

    // River / Ocean at top
    ctx.fillStyle = '#0284c7';
    ctx.fillRect(0, 0, cvs.width, 60);
    ctx.font = '28px sans-serif';
    ctx.fillText('⛵', 300, 45);

    // Plots
    plots.forEach(p => {
      ctx.fillStyle = '#78350f';
      ctx.beginPath();
      ctx.roundRect(p.x - 35, p.y - 35, 70, 70, 16);
      ctx.fill();

      if (p.state === 'sprout') {
        ctx.font = '36px sans-serif';
        ctx.fillText('🌱', p.x - 18, p.y + 12);
      } else if (p.state === 'ripe') {
        ctx.font = '36px sans-serif';
        ctx.fillText('🍓', p.x - 18, p.y + 12);
      }
    });

    // Nico the cat
    ctx.font = '40px sans-serif';
    ctx.fillText('🐱', 170, 95);

    requestAnimationFrame(render);
  }

  render();
</script>
</body>
</html>
