<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Cats Love Cake</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background: #fdf2f8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #475569; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 16px; overflow: hidden;
  }
  .header { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 440px; margin-bottom: 12px; }
  .title { font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 8px; color: #db2777; }
  .canvas-box {
    position: relative; width: 380px; height: 380px; background: linear-gradient(180deg, #fce7f3 0%, #ede9fe 100%);
    border-radius: 24px; border: 3px solid #f472b6; box-shadow: 0 20px 40px rgba(219,39,119,0.15); overflow: hidden;
  }
  canvas { width: 100%; height: 100%; cursor: pointer; touch-action: none; }
  .controls { display: flex; gap: 12px; margin-top: 14px; width: 100%; max-width: 380px; }
  .btn {
    flex: 1; background: #ec4899; border: none; color: white; padding: 12px;
    border-radius: 16px; font-size: 15px; font-weight: 800; cursor: pointer;
    box-shadow: 0 4px 12px rgba(236,72,153,0.3); transition: transform .1s;
  }
  .btn:active { transform: scale(0.96); }
  .tip { margin-top: 10px; font-size: 13px; color: #9d174d; font-weight: 700; text-align: center; }
</style>
</head>
<body>
<div class="header">
  <div class="title"><span>🐱</span> Cats Love Cake</div>
  <div style="font-size:13px; color:#db2777; font-weight:800;" id="lvlText">Level 1</div>
</div>
<div class="canvas-box">
  <canvas id="cvs" width="380" height="380"></canvas>
</div>
<div class="controls">
  <button class="btn" onpointerdown="moveLeft()">◀ Bounce Left</button>
  <button class="btn" onpointerdown="moveRight()">Bounce Right ▶</button>
</div>
<div class="tip" id="tip">Bounce your chubby marshmallow cat across to reach the delicious cake! 🍰</div>

<script>
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function meow() {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.frequency.setValueAtTime(450, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(700, audioCtx.currentTime + 0.15);
    g.gain.setValueAtTime(0.2, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.25);
  }

  const cvs = document.getElementById('cvs');
  const ctx = cvs.getContext('2d');

  let cat = { x: 50, y: 280, vx: 0, vy: 0, r: 20, squash: 1 };
  let platforms = [
    { x: 20, y: 320, w: 90, h: 20 },
    { x: 140, y: 260, w: 90, h: 20 },
    { x: 260, y: 200, w: 100, h: 20 }
  ];
  let cake = { x: 300, y: 160, r: 18 };

  function moveLeft() { cat.vx = -3.5; }
  function moveRight() { cat.vx = 3.5; }

  window.onkeydown = e => {
    if (e.key === 'ArrowLeft' || e.key === 'a') moveLeft();
    if (e.key === 'ArrowRight' || e.key === 'd') moveRight();
  };

  function update() {
    cat.vy += 0.25; // gravity
    cat.x += cat.vx;
    cat.y += cat.vy;
    cat.vx *= 0.92;

    // Platform bounce
    platforms.forEach(p => {
      if (cat.x >= p.x - 10 && cat.x <= p.x + p.w + 10 && cat.y + cat.r >= p.y && cat.y + cat.r <= p.y + 16 && cat.vy > 0) {
        cat.y = p.y - cat.r;
        cat.vy = -6.2; // automatic joyous bounce
        cat.squash = 1.3;
      }
    });

    cat.squash += (1 - cat.squash) * 0.1;

    // Boundary wrap / floor respawn
    if (cat.y > cvs.height + 40) {
      cat.x = 50; cat.y = 280; cat.vy = -4;
    }

    // Cake collision
    const d = Math.hypot(cat.x - cake.x, cat.y - cake.y);
    if (d < cat.r + cake.r) {
      meow();
      document.getElementById('tip').innerHTML = '<span style="color:#db2777; font-size:15px; font-weight:800;">🎉 Purrfect! Cat is so happy with the cake! 🍰</span>';
      cat.x = 50; cat.y = 280; cat.vy = -4;
    }
  }

  function render() {
    ctx.clearRect(0, 0, cvs.width, cvs.height);

    // Platforms
    ctx.fillStyle = '#a78bfa';
    platforms.forEach(p => {
      ctx.beginPath();
      ctx.roundRect(p.x, p.y, p.w, p.h, 10);
      ctx.fill();
    });

    // Cake
    ctx.font = '32px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('🍰', cake.x, cake.y + 10);

    // Cat
    ctx.save();
    ctx.translate(cat.x, cat.y);
    ctx.scale(1 / cat.squash, cat.squash);

    // Cat body
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(0, 0, cat.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#f472b6';
    ctx.stroke();

    // Cat ears
    ctx.fillStyle = '#f472b6';
    ctx.beginPath();
    ctx.moveTo(-14, -12); ctx.lineTo(-8, -26); ctx.lineTo(-2, -14); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(14, -12); ctx.lineTo(8, -26); ctx.lineTo(2, -14); ctx.fill();

    // Cat face
    ctx.fillStyle = '#1e293b';
    ctx.beginPath();
    ctx.arc(-6, -2, 2.5, 0, Math.PI * 2);
    ctx.arc(6, -2, 2.5, 0, Math.PI * 2);
    ctx.fill();

    // Rosy cheeks
    ctx.fillStyle = '#fbcfe8';
    ctx.beginPath();
    ctx.arc(-10, 3, 3.5, 0, Math.PI * 2);
    ctx.arc(10, 3, 3.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();

    update();
    requestAnimationFrame(render);
  }

  render();
</script>
</body>
</html>
