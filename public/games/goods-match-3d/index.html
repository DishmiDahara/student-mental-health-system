<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Goods Triple Match 3D</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: white; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 16px; overflow: hidden;
  }
  .header { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 440px; margin-bottom: 12px; }
  .title { font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 8px; color: #f59e0b; }
  .shelf-box {
    width: 380px; height: 360px; background: #78350f; border-radius: 24px;
    border: 6px solid #451a03; box-shadow: 0 25px 50px rgba(0,0,0,0.6);
    display: flex; flex-direction: column; justify-content: space-around; padding: 14px;
  }
  .shelf-row {
    height: 95px; background: #92400e; border-radius: 12px; border-bottom: 8px solid #451a03;
    display: flex; align-items: center; justify-content: space-around; padding: 0 10px;
  }
  .goods-item {
    font-size: 38px; cursor: pointer; transition: transform .15s ease;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
  }
  .goods-item:hover { transform: scale(1.15) translateY(-4px); }
  .bag-bar {
    width: 100%; max-width: 380px; margin-top: 14px; background: rgba(255,255,255,0.08);
    padding: 10px 16px; border-radius: 18px; border: 1px solid rgba(255,255,255,0.15);
    display: flex; align-items: center; justify-content: space-between;
  }
  .tip { margin-top: 12px; font-size: 13.5px; color: #94a3b8; font-weight: 600; text-align: center; }
</style>
</head>
<body>
<div class="header">
  <div class="title"><span>🥫</span> Goods Triple Match 3D</div>
  <div style="font-size:13px; color:#f59e0b; font-weight:800;" id="score">Packed: 0</div>
</div>
<div class="shelf-box" id="shelves">
  <div class="shelf-row" id="row1"></div>
  <div class="shelf-row" id="row2"></div>
  <div class="shelf-row" id="row3"></div>
</div>
<div class="bag-bar">
  <span style="font-size:13px; color:#cbd5e1; font-weight:700;">Cart Basket:</span>
  <div id="cart" style="display:flex; gap:8px; font-size:26px;"></div>
</div>
<div class="tip" id="tip">Tap 3 matching items to pack them into your shopping cart!</div>

<script>
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function thudAudio(f = 320) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.frequency.setValueAtTime(f, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(f * 0.4, audioCtx.currentTime + 0.12);
    g.gain.setValueAtTime(0.2, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.12);
  }

  const ITEMS = ['🧃', '🧃', '🧃', '🥫', '🥫', '🥫', '🍪', '🍪', '🍪'];
  let pool = [...ITEMS].sort(() => Math.random() - 0.5);
  let cart = [];
  let score = 0;

  function renderShelves() {
    const rows = [document.getElementById('row1'), document.getElementById('row2'), document.getElementById('row3')];
    rows.forEach(r => r.innerHTML = '');
    pool.forEach((item, idx) => {
      if (item) {
        const el = document.createElement('div');
        el.className = 'goods-item';
        el.textContent = item;
        el.onclick = () => pickItem(idx);
        rows[Math.floor(idx / 3)].appendChild(el);
      }
    });
  }

  function pickItem(idx) {
    const item = pool[idx];
    if (!item) return;
    thudAudio(440);
    cart.push(item);
    pool[idx] = null;
    renderShelves();
    renderCart();

    // Check if 3 matching in cart
    const counts = {};
    cart.forEach(c => counts[c] = (counts[c] || 0) + 1);
    for (const [key, val] of Object.entries(counts)) {
      if (val === 3) {
        thudAudio(660);
        score += 3;
        cart = cart.filter(c => c !== key);
        document.getElementById('score').textContent = `Packed: ${score}`;
        renderCart();
        if (score >= 9) {
          document.getElementById('tip').innerHTML = '<span style="color:#f59e0b; font-weight:800; font-size:15px;">🎉 Pantry completely organized & tidy! Great focus.</span>';
        }
      }
    }
  }

  function renderCart() {
    const el = document.getElementById('cart');
    el.innerHTML = cart.map(c => `<span>${c}</span>`).join('');
  }

  renderShelves();
</script>
</body>
</html>
