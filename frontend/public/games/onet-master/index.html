<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Onet Master</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background: #1e1b4b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: white; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 16px; overflow: hidden;
  }
  .header { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 440px; margin-bottom: 16px; }
  .title { font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 8px; color: #f472b6; }
  .grid-box {
    width: 360px; height: 360px; background: rgba(0,0,0,0.3); border-radius: 24px;
    border: 2px solid rgba(255,255,255,0.1); display: grid; grid-template-columns: repeat(4, 1fr);
    padding: 16px; gap: 10px; box-shadow: 0 20px 40px rgba(0,0,0,0.5);
  }
  .tile {
    background: #312e81; border-radius: 16px; display: flex; align-items: center; justify-content: center;
    font-size: 32px; cursor: pointer; border: 2px solid transparent;
    transition: transform .15s, background .15s, border-color .15s;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }
  .tile:hover { transform: scale(1.05); }
  .tile.selected { border-color: #f472b6; background: #4338ca; transform: scale(1.08); box-shadow: 0 0 15px #f472b6; }
  .tile.empty { visibility: hidden; }
  .tip { margin-top: 16px; font-size: 13.5px; color: #cbd5e1; font-weight: 600; text-align: center; }
</style>
</head>
<body>
<div class="header">
  <div class="title"><span>🍓</span> Onet Master</div>
  <div style="font-size:13px; color:#f472b6; font-weight:800;" id="pairsCount">8 Pairs Left</div>
</div>
<div class="grid-box" id="grid"></div>
<div class="tip" id="tip">Match pairs of identical fruit tiles to clear the board!</div>

<script>
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function chime(f = 520) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.frequency.setValueAtTime(f, audioCtx.currentTime);
    g.gain.setValueAtTime(0.2, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.25);
  }

  const ICONS = ['🍎', '🍇', '🍊', '🥑', '🍓', '🍋', '🍒', '🥝'];
  let deck = [...ICONS, ...ICONS].sort(() => Math.random() - 0.5);
  let selectedIdx = null;
  let remaining = 8;

  const grid = document.getElementById('grid');

  function render() {
    grid.innerHTML = '';
    deck.forEach((icon, i) => {
      const el = document.createElement('div');
      el.className = 'tile' + (icon === null ? ' empty' : '') + (selectedIdx === i ? ' selected' : '');
      el.textContent = icon || '';
      el.onclick = () => selectTile(i);
      grid.appendChild(el);
    });
  }

  function selectTile(idx) {
    if (deck[idx] === null) return;
    if (selectedIdx === null) {
      selectedIdx = idx;
      chime(440);
      render();
    } else if (selectedIdx === idx) {
      selectedIdx = null;
      render();
    } else {
      if (deck[selectedIdx] === deck[idx]) {
        deck[selectedIdx] = null;
        deck[idx] = null;
        remaining--;
        chime(660);
        document.getElementById('pairsCount').textContent = `${remaining} Pairs Left`;
        selectedIdx = null;
        render();
        if (remaining === 0) {
          document.getElementById('tip').innerHTML = '<span style="color:#f472b6; font-weight:800; font-size:15px;">🎉 Wonderful! All fruit pairs matched and cleared.</span>';
        }
      } else {
        chime(260);
        selectedIdx = idx;
        render();
      }
    }
  }

  render();
</script>
</body>
</html>
