<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Grow Your Home</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background: #064e3b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: white; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 16px; overflow: hidden;
  }
  .header { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 440px; margin-bottom: 12px; }
  .title { font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 8px; color: #a7f3d0; }
  .window-box {
    position: relative; width: 380px; height: 380px; background: linear-gradient(180deg, #38bdf8 0%, #bae6fd 60%, #fed7aa 100%);
    border-radius: 28px; border: 8px solid #78350f; box-shadow: 0 25px 50px rgba(0,0,0,0.6);
    overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
  }
  .sill { width: 100%; height: 50px; background: #92400e; border-top: 4px solid #b45309; }
  .pot {
    position: absolute; bottom: 35px; width: 110px; height: 95px; background: #c2410c;
    border-radius: 0 0 25px 25px; border: 4px solid #9a3412; box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    display: flex; justify-content: center;
  }
  .pot::before {
    content: ''; position: absolute; top: -14px; width: 126px; height: 18px;
    background: #ea580c; border-radius: 6px; border: 3px solid #9a3412;
  }
  .plant-stem {
    position: absolute; bottom: 115px; width: 10px; background: #15803d; border-radius: 6px;
    transform-origin: bottom center; transition: height 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .leaf {
    position: absolute; width: 40px; height: 24px; background: #22c55e; border-radius: 50% 0 50% 0;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2); transition: transform 0.4s ease;
  }
  .controls { display: flex; gap: 10px; margin-top: 14px; width: 100%; max-width: 380px; }
  .btn {
    flex: 1; background: #059669; border: none; color: white; padding: 12px;
    border-radius: 14px; font-size: 13.5px; font-weight: 800; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    box-shadow: 0 4px 12px rgba(5,150,105,0.4); transition: transform .1s;
  }
  .btn:active { transform: scale(0.96); }
  .tip { margin-top: 12px; font-size: 13px; color: #6ee7b7; font-weight: 600; text-align: center; }
</style>
</head>
<body>
<div class="header">
  <div class="title"><span>🌱</span> Grow Your Home</div>
  <div style="font-size:13px; color:#a7f3d0; font-weight:800;" id="growthStage">Stage: Seedling</div>
</div>
<div class="window-box" id="windowBox">
  <div class="plant-stem" id="stem" style="height: 40px;">
    <div class="leaf" id="leaf1" style="top: 5px; left: -35px; transform: rotate(-25deg) scale(0.6);"></div>
    <div class="leaf" id="leaf2" style="top: 15px; right: -35px; transform: rotate(65deg) scale(0.6);"></div>
  </div>
  <div class="pot"></div>
  <div class="sill"></div>
</div>
<div class="controls">
  <button class="btn" onclick="waterPlant()">
    <span>💧</span>
    <span>Water Pot</span>
  </button>
  <button class="btn" style="background:#0284c7;" onclick="sunlightToggle()">
    <span>☀️</span>
    <span>Sunlight</span>
  </button>
</div>
<div class="tip" id="tip">Tap 'Water Pot' to nurture your indoor plant and watch it unfurl lush leaves!</div>

<script>
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function dripSound() {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(750, audioCtx.currentTime + 0.12);
    g.gain.setValueAtTime(0.2, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.12);
  }

  let height = 40;
  let stage = 1;

  function waterPlant() {
    dripSound();
    height += 25;
    if (height > 160) height = 160;
    document.getElementById('stem').style.height = height + 'px';
    const scale = 0.6 + (height / 140);
    document.getElementById('leaf1').style.transform = `rotate(-25deg) scale(${scale})`;
    document.getElementById('leaf2').style.transform = `rotate(65deg) scale(${scale})`;
    stage++;
    if (stage === 3) document.getElementById('growthStage').textContent = 'Stage: Sprouting';
    if (stage >= 5) {
      document.getElementById('growthStage').textContent = 'Stage: Blooming Sanctuary';
      document.getElementById('tip').innerHTML = '<span style="color:#a7f3d0; font-weight:800; font-size:15px;">🌸 Full vibrant bloom! Pure botanical tranquility.</span>';
    }
  }

  let day = true;
  function sunlightToggle() {
    day = !day;
    document.getElementById('windowBox').style.background = day
      ? 'linear-gradient(180deg, #38bdf8 0%, #bae6fd 60%, #fed7aa 100%)'
      : 'linear-gradient(180deg, #0f172a 0%, #1e1b4b 60%, #312e81 100%)';
  }
</script>
</body>
</html>
