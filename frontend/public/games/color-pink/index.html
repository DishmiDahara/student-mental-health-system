<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Pink - Bart Bonte Style</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background: #831843; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: white; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 16px; overflow: hidden; transition: background 0.6s ease;
  }
  .header { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 440px; margin-bottom: 16px; }
  .title { font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 8px; color: #f472b6; }
  .game-box {
    width: 360px; height: 380px; background: #9d174d; border-radius: 24px;
    border: 2px solid #db2777; box-shadow: 0 25px 50px rgba(0,0,0,0.5);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
  }
  .bubble-gum {
    width: 80px; height: 80px; border-radius: 50%; background: #f472b6;
    box-shadow: 0 10px 25px rgba(244,114,182,0.6); cursor: pointer;
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .tip { margin-top: 16px; font-size: 14px; color: #fbcfe8; font-weight: 700; text-align: center; }
</style>
</head>
<body>
<div class="header">
  <div class="title"><span>🌸</span> Pink</div>
  <div style="font-size:13px; color:#f472b6; font-weight:800;">Level 1</div>
</div>
<div class="game-box" id="box">
  <div class="bubble-gum" id="gum" onclick="blowGum()"></div>
</div>
<div class="tip" id="tip">Tap the bubble gum to blow it bigger until the screen turns PINK!</div>

<script>
  let scale = 1;
  function blowGum() {
    scale += 0.5;
    const el = document.getElementById('gum');
    el.style.transform = `scale(${scale})`;
    if (scale >= 4.5) {
      document.body.style.background = '#ec4899';
      document.getElementById('box').style.background = '#f472b6';
      document.getElementById('tip').innerHTML = '<span style="color:#ffffff; font-weight:800; font-size:16px;">🎉 POP! Everything turned delightfully PINK!</span>';
    }
  }
</script>
</body>
</html>
