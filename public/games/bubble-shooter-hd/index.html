<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Bubble Shooter HD</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background: radial-gradient(circle at center, #1e1b4b 0%, #090d16 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: white; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 16px; overflow: hidden;
  }
  .header { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 440px; margin-bottom: 12px; }
  .title { font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 8px; color: #38bdf8; }
  .canvas-box {
    position: relative; width: 380px; height: 420px; background: rgba(255,255,255,0.03);
    border-radius: 28px; border: 2px solid rgba(255,255,255,0.1); box-shadow: 0 25px 50px rgba(0,0,0,0.6);
    overflow: hidden;
  }
  canvas { width: 100%; height: 100%; cursor: pointer; }
  .tip { margin-top: 14px; font-size: 13.5px; color: #94a3b8; font-weight: 600; text-align: center; }
</style>
</head>
<body>
<div class="header">
  <div class="title"><span>🔮</span> Bubble Shooter HD</div>
  <div style="font-size:13px; color:#38bdf8; font-weight:800;" id="score">Score: 0</div>
</div>
<div class="canvas-box">
  <canvas id="cvs" width="380" height="420"></canvas>
</div>
<div class="tip" id="tip">Tap to launch prismatic glass bubbles for cascading celebratory chain pops!</div>

<script>
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function glassChime(f = 600) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.frequency.setValueAtTime(f, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(f * 1.6, audioCtx.currentTime + 0.15);
    g.gain.setValueAtTime(0.2, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.15);
  }

  const cvs = document.getElementById('cvs');
  const ctx = cvs.getContext('2d');
  const COLORS = ['#38bdf8', '#f43f5e', '#a855f7', '#10b981', '#f59e0b'];

  let orbs = [];
  let score = 0;

  function initOrbs() {
    orbs = [];
    for (let r = 0; r < 4; r++) {
      for (let c = 0; c < 7; c++) {
        orbs.push({
          x: c * 50 + 40,
          y: r * 45 + 40,
          color: COLORS[Math.floor(Math.random() * COLORS.length)],
          r: 20
        });
      }
    }
  }

  function render() {
    ctx.clearRect(0, 0, cvs.width, cvs.height);

    orbs.forEach(o => {
      ctx.save();
      ctx.beginPath();
      ctx.arc(o.x, o.y, o.r, 0, Math.PI * 2);
      ctx.fillStyle = o.color;
      ctx.fill();

      // Glass specular reflection
      ctx.beginPath();
      ctx.arc(o.x - 6, o.y - 6, 7, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.fill();
      ctx.restore();
    });

    requestAnimationFrame(render);
  }

  cvs.onpointerdown = e => {
    glassChime(640);
    score += 50;
    document.getElementById('score').textContent = `Score: ${score}`;
    if (orbs.length > 5) {
      orbs.splice(0, 3);
    }
    if (score >= 250) {
      document.getElementById('tip').innerHTML = '<span style="color:#38bdf8; font-weight:800; font-size:15px;">🎉 High-Definition Cascade! Pure joyous celebration!</span>';
    }
  };

  initOrbs();
  render();
</script>
</body>
</html>
