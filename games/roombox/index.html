<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Roombox Design Studio</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: white; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 16px; overflow: hidden;
  }
  .header { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 440px; margin-bottom: 12px; }
  .title { font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 8px; color: #a78bfa; }
  .room-container {
    perspective: 800px; width: 380px; height: 360px; display: flex; align-items: center; justify-content: center;
  }
  .roombox-isometric {
    width: 320px; height: 300px; background: #ede9fe; border-radius: 20px;
    box-shadow: 0 25px 50px rgba(0,0,0,0.5), inset 0 0 0 3px #c4b5fd;
    position: relative; overflow: hidden;
  }
  .back-wall {
    position: absolute; top: 0; left: 0; width: 100%; height: 60%;
    background: linear-gradient(180deg, #ddd6fe 0%, #c4b5fd 100%);
    border-bottom: 3px solid #a78bfa;
  }
  .poster {
    position: absolute; top: 25px; left: 40px; width: 50px; height: 65px;
    background: #fbcfe8; border: 2px solid white; border-radius: 4px; box-shadow: 0 4px 8px rgba(0,0,0,0.15);
    display: flex; align-items: center; justify-content: center; font-size: 20px;
  }
  .window {
    position: absolute; top: 20px; right: 40px; width: 70px; height: 75px;
    background: #bae6fd; border: 4px solid white; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.15);
    display: flex; align-items: center; justify-content: center; font-size: 26px;
  }
  .room-item {
    position: absolute; cursor: grab; font-size: 40px; filter: drop-shadow(0 6px 12px rgba(0,0,0,0.25));
    transition: transform .15s ease;
  }
  .room-item:active { transform: scale(1.1); cursor: grabbing; }
  .furniture-bar {
    display: flex; gap: 10px; width: 100%; max-width: 440px; margin-top: 14px;
    background: rgba(255,255,255,0.08); padding: 8px 14px; border-radius: 18px; border: 1px solid rgba(255,255,255,0.15);
  }
  .f-btn {
    flex: 1; background: #334155; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px;
    padding: 8px 4px; font-size: 24px; cursor: pointer; transition: transform .1s;
    display: flex; align-items: center; justify-content: center;
  }
  .f-btn:hover { background: #475569; transform: translateY(-2px); }
  .tip { margin-top: 12px; font-size: 13.5px; color: #cbd5e1; font-weight: 600; text-align: center; }
</style>
</head>
<body>
<div class="header">
  <div class="title"><span>🛋️</span> Roombox Design</div>
  <div style="font-size:13px; color:#a78bfa; font-weight:800;" id="decorCount">0 Items Placed</div>
</div>
<div class="room-container">
  <div class="roombox-isometric" id="room">
    <div class="back-wall">
      <div class="poster">🌿</div>
      <div class="window">☁️</div>
    </div>
  </div>
</div>
<div class="furniture-bar">
  <button class="f-btn" onclick="spawnItem('🪴')">🪴</button>
  <button class="f-btn" onclick="spawnItem('🛋️')">🛋️</button>
  <button class="f-btn" onclick="spawnItem('💡')">💡</button>
  <button class="f-btn" onclick="spawnItem('🐱')">🐱</button>
  <button class="f-btn" onclick="spawnItem('☕')">☕</button>
</div>
<div class="tip" id="tip">Tap furniture to add cozy items to your miniature dream diorama!</div>

<script>
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function snapAudio() {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.frequency.setValueAtTime(450, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.12);
    g.gain.setValueAtTime(0.2, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.12);
  }

  const room = document.getElementById('room');
  let placed = 0;

  function spawnItem(icon) {
    snapAudio();
    const el = document.createElement('div');
    el.className = 'room-item';
    el.textContent = icon;
    el.style.left = (40 + (placed % 4) * 65) + 'px';
    el.style.top = (170 + Math.floor(placed / 4) * 45) + 'px';

    // Dragging
    let isDragging = false;
    let ox = 0, oy = 0;
    el.onpointerdown = e => {
      isDragging = true;
      const r = el.getBoundingClientRect();
      ox = e.clientX - r.left;
      oy = e.clientY - r.top;
      el.setPointerCapture(e.pointerId);
    };
    el.onpointermove = e => {
      if (isDragging) {
        const rr = room.getBoundingClientRect();
        el.style.left = (e.clientX - rr.left - ox) + 'px';
        el.style.top = (e.clientY - rr.top - oy) + 'px';
      }
    };
    el.onpointerup = () => { isDragging = false; snapAudio(); };

    room.appendChild(el);
    placed++;
    document.getElementById('decorCount').textContent = `${placed} Items Placed`;
    if (placed >= 4) {
      document.getElementById('tip').innerHTML = '<span style="color:#a78bfa; font-weight:800; font-size:15px;">✨ Such a warm, aesthetic sanctuary! Feel at peace.</span>';
    }
  }
</script>
</body>
</html>
