<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Calm Fluid Canvas</title>
  <!--
    Calm Fluid Canvas - based on "WebGL Fluid Simulation" by Pavel Dobryakov (MIT License).
    Source: https://github.com/PavelDoGreat/WebGL-Fluid-Simulation
    Hosted locally inside MindSpace. See LICENSE.txt in this folder.
    Changes: removed the control panel, analytics, promo popup and external links.
  -->
  <style>
    * { user-select: none; -webkit-tap-highlight-color: transparent; }
    html, body { overflow: hidden; background-color: #000; }
    body { margin: 0; position: fixed; width: 100%; height: 100%; font-family: system-ui, sans-serif; }
    canvas { width: 100%; height: 100%; display: block; touch-action: none; }
    #hint {
      position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
      color: rgba(255,255,255,0.8); font-size: 13px; background: rgba(0,0,0,0.45);
      padding: 6px 14px; border-radius: 999px; pointer-events: none;
      transition: opacity 1s ease; text-align: center; max-width: 90%;
    }
  </style>
</head>
<body>
  <canvas></canvas>
  <div id="hint">Touch and drag to paint with flowing colour. Tap Space for a splash.</div>
  <script src="./script.js"></script>
  <script>
    setTimeout(function () { document.getElementById('hint').style.opacity = '0'; }, 7000);
  </script>
</body>
</html>
