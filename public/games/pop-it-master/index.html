<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Pop It Master - MindSpace Relaxing ASMR</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
  body {
    background: radial-gradient(circle at center, #1e1b4b 0%, #0b0f19 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: white;
    overflow: hidden;
    padding: 12px;
  }
  .app-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    max-width: 420px;
    margin-bottom: 12px;
  }
  .app-title {
    font-size: clamp(16px, 4vw, 20px);
    font-weight: 800;
    display: flex;
    align-items: center;
    gap: 8px;
    color: #f8fafc;
  }
  .app-badge {
    background: rgba(56, 189, 248, 0.18);
    border: 1px solid rgba(56, 189, 248, 0.35);
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    color: #38bdf8;
  }
  .controls-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 14px;
    width: 100%;
    max-width: 420px;
  }
  .btn-ctrl {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.16);
    color: #e2e8f0;
    padding: 6px 14px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.15s ease;
  }
  .btn-ctrl:hover, .btn-ctrl:active {
    background: rgba(255, 255, 255, 0.18);
    color: white;
    transform: translateY(-1px);
  }
  .btn-ctrl.active {
    background: #0284c7;
    border-color: #38bdf8;
    color: white;
  }
  .board-wrapper {
    perspective: 1200px;
    width: 100%;
    max-width: 380px;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .pop-board {
    width: min(340px, 84vw);
    height: min(340px, 84vw);
    border-radius: clamp(24px, 6vw, 38px);
    padding: clamp(14px, 3.5vw, 22px);
    background: linear-gradient(135deg, #f43f5e, #ec4899, #8b5cf6, #3b82f6, #06b6d4, #10b981, #f59e0b);
    box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6), inset 0 2px 4px rgba(255, 255, 255, 0.45);
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: clamp(8px, 2vw, 12px);
    transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    transform-style: preserve-3d;
  }
  .pop-board.flipped {
    transform: rotateY(180deg);
  }
  /* Theme Variants */
  .pop-board.theme-ocean {
    background: linear-gradient(135deg, #0284c7, #0ea5e9, #06b6d4, #14b8a6, #2dd4bf);
  }
  .pop-board.theme-pastel {
    background: linear-gradient(135deg, #f472b6, #c084fc, #818cf8, #67e8f9, #a7f3d0);
  }
  .pop-board.theme-sunset {
    background: linear-gradient(135deg, #f43f5e, #fb923c, #fbbf24, #f59e0b, #e11d48);
  }
  .bubble {
    border-radius: 50%;
    background: radial-gradient(circle at 35% 32%, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0.4) 28%, rgba(0, 0, 0, 0.15) 100%);
    box-shadow: 0 5px 10px rgba(0, 0, 0, 0.35), inset 0 -3px 4px rgba(0, 0, 0, 0.25), inset 0 3px 5px rgba(255, 255, 255, 0.85);
    cursor: pointer;
    touch-action: none;
    transition: transform 0.1s ease, box-shadow 0.1s ease, filter 0.1s ease;
  }
  .bubble:hover {
    transform: scale(1.06);
  }
  .bubble:active {
    transform: scale(0.92);
  }
  .bubble.popped {
    box-shadow: inset 0 5px 9px rgba(0, 0, 0, 0.65), inset 0 -2px 3px rgba(255, 255, 255, 0.25);
    transform: scale(0.92);
    filter: brightness(0.82) contrast(1.1);
  }
  .tip-box {
    margin-top: 16px;
    font-size: 12.5px;
    color: #94a3b8;
    font-weight: 600;
    text-align: center;
    max-width: 360px;
    min-height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .pulse-banner {
    animation: popPulse 1.2s ease-in-out infinite;
    color: #38bdf8;
    font-weight: 800;
  }
  @keyframes popPulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.7; transform: scale(1.03); }
  }
  .theme-dots {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .theme-dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    cursor: pointer;
    border: 1px solid rgba(255, 255, 255, 0.4);
    transition: transform 0.15s ease;
  }
  .theme-dot:hover {
    transform: scale(1.25);
  }
</style>
</head>
<body>
<div class="app-header">
  <div class="app-title">
    <span>🫧</span> Pop It Master
  </div>
  <div class="app-badge" id="counter">0 / 36 Popped</div>
</div>

<div class="controls-bar">
  <button class="btn-ctrl" id="flipBtn" title="Flip Board to pop reverse side">
    <span>🔄</span> Flip Board
  </button>
  <button class="btn-ctrl" id="resetBtn" title="Reset all bubbles">
    <span>✨</span> Reset
  </button>
  <button class="btn-ctrl" id="soundBtn" title="Toggle Sound">
    <span id="soundIcon">🔊</span> Sound
  </button>
  <div class="theme-dots" title="Change Theme">
    <span class="theme-dot" style="background: linear-gradient(135deg, #f43f5e, #3b82f6);" data-theme="" title="Rainbow"></span>
    <span class="theme-dot" style="background: linear-gradient(135deg, #f472b6, #818cf8);" data-theme="theme-pastel" title="Pastel"></span>
    <span class="theme-dot" style="background: linear-gradient(135deg, #0284c7, #2dd4bf);" data-theme="theme-ocean" title="Ocean"></span>
    <span class="theme-dot" style="background: linear-gradient(135deg, #fb923c, #f43f5e);" data-theme="theme-sunset" title="Sunset"></span>
  </div>
</div>

<div class="board-wrapper">
  <div class="pop-board" id="board"></div>
</div>

<div class="tip-box" id="tip">
  Tap or drag across bubbles to pop them • 100% In-App ASMR
</div>

<script>
  let soundEnabled = true;
  let audioCtx = null;

  function initAudio() {
    if (!audioCtx) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (AudioContext) audioCtx = new AudioContext();
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function playPopSound(freq = 420) {
    if (!soundEnabled) return;
    try {
      initAudio();
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      const pitch = freq + (Math.random() * 80 - 40);
      osc.frequency.setValueAtTime(pitch, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(pitch * 0.35, audioCtx.currentTime + 0.08);
      gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.08);
    } catch (e) {}
  }

  const board = document.getElementById('board');
  const counter = document.getElementById('counter');
  const flipBtn = document.getElementById('flipBtn');
  const resetBtn = document.getElementById('resetBtn');
  const soundBtn = document.getElementById('soundBtn');
  const soundIcon = document.getElementById('soundIcon');
  const tip = document.getElementById('tip');
  const TOTAL = 36;
  let poppedCount = 0;
  let isFlipped = false;
  let isPointerDown = false;

  function createBoard() {
    board.innerHTML = '';
    poppedCount = 0;
    updateCounter();
    for (let i = 0; i < TOTAL; i++) {
      const b = document.createElement('div');
      b.className = 'bubble';
      b.dataset.id = i;

      b.addEventListener('pointerdown', (e) => {
        isPointerDown = true;
        initAudio();
        popBubble(b);
      });
      b.addEventListener('pointerenter', () => {
        if (isPointerDown) popBubble(b);
      });
      board.appendChild(b);
    }
  }

  window.addEventListener('pointerup', () => isPointerDown = false);
  window.addEventListener('pointercancel', () => isPointerDown = false);

  function popBubble(el) {
    if (!el.classList.contains('popped')) {
      el.classList.add('popped');
      poppedCount++;
      playPopSound(350 + (poppedCount * 9));
      updateCounter();
      if (poppedCount === TOTAL) {
        tip.innerHTML = '<span class="pulse-banner">🎉 All 36 Popped! Flip the board to pop the reverse side!</span>';
      }
    }
  }

  function updateCounter() {
    counter.textContent = `${poppedCount} / ${TOTAL} Popped`;
  }

  flipBtn.addEventListener('click', () => {
    isFlipped = !isFlipped;
    board.classList.toggle('flipped', isFlipped);
    playPopSound(260);
    setTimeout(() => {
      document.querySelectorAll('.bubble').forEach(b => b.classList.remove('popped'));
      poppedCount = 0;
      updateCounter();
      tip.textContent = 'Board flipped! Pop the reverse side.';
    }, 280);
  });

  resetBtn.addEventListener('click', () => {
    document.querySelectorAll('.bubble').forEach(b => b.classList.remove('popped'));
    poppedCount = 0;
    updateCounter();
    tip.textContent = 'Tap or drag across bubbles to pop them • Relieves tension & stress';
    playPopSound(300);
  });

  soundBtn.addEventListener('click', () => {
    soundEnabled = !soundEnabled;
    soundIcon.textContent = soundEnabled ? '🔊' : '🔇';
    soundBtn.classList.toggle('active', !soundEnabled);
  });

  // Themes
  document.querySelectorAll('.theme-dot').forEach(dot => {
    dot.addEventListener('click', () => {
      const theme = dot.dataset.theme;
      board.className = 'pop-board' + (isFlipped ? ' flipped' : '') + (theme ? ' ' + theme : '');
      playPopSound(450);
    });
  });

  createBoard();
</script>
</body>
</html>
