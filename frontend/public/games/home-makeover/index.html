<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Home Makeover Cleaning Game</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: white; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 16px; overflow: hidden;
  }
  .header { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 440px; margin-bottom: 12px; }
  .title { font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 8px; color: #38bdf8; }
  .bedroom-box {
    position: relative; width: 380px; height: 360px; background: #fce7f3;
    border-radius: 28px; border: 4px solid #f472b6; box-shadow: 0 25px 50px rgba(0,0,0,0.6);
    overflow: hidden;
  }
  .dirt-item {
    position: absolute; font-size: 38px; cursor: pointer; transition: transform .2s ease;
  }
  .dirt-item:hover { transform: scale(1.2); }
  .controls { display: flex; gap: 10px; width: 100%; max-width: 380px; margin-top: 14px; }
  .btn {
    flex: 1; background: #0284c7; border: none; color: white; padding: 12px;
    border-radius: 14px; font-size: 13.5px; font-weight: 800; cursor: pointer;
    box-shadow: 0 4px 12px rgba(2,132,199,0.3); transition: transform .1s;
  }
  .btn:active { transform: scale(0.96); }
  .tip { margin-top: 12px; font-size: 13px; color: #94a3b8; font-weight: 600; text-align: center; }
</style>
</head>
<body>
<div class="header">
  <div class="title"><span>🧹</span> Home Makeover</div>
  <div style="font-size:13px; color:#38bdf8; font-weight:800;" id="trashCount">5 Clutter Left</div>
</div>
<div class="bedroom-box" id="room">
  <div style="position:absolute; bottom:20px; left:40px; font-size:70px;">🛏️</div>
  <div style="position:absolute; bottom:25px; right:40px; font-size:50px;">🪴</div>
  <div class="dirt-item" id="d1" style="top:50px; left:60px;" onclick="cleanItem('d1')">🧦</div>
  <div class="dirt-item" id="d2" style="top:90px; right:70px;" onclick="cleanItem('d2')">📦</div>
  <div class="dirt-item" id="d3" style="top:180px; left:140px;" onclick="cleanItem('d3')">🍕</div>
  <div class="dirt-item" id="d4" style="bottom:110px; right:110px;" onclick="cleanItem('d4')">📄</div>
  <div class="dirt-item" id="d5" style="top:130px; left:250px;" onclick="cleanItem('d5')">🥤</div>
</div>
<div class="controls">
  <button class="btn" onclick="resetRoom()">🔄 Reset Room</button>
</div>
<div class="tip" id="tip">Tap scattered laundry, soda cans, and clutter to vacuum and tidy the bedroom!</div>

<script>
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function whooshSound() {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.frequency.setValueAtTime(380, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(750, audioCtx.currentTime + 0.12);
    g.gain.setValueAtTime(0.2, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.12);
  }

  let remaining = 5;

  function cleanItem(id) {
    whooshSound();
    const el = document.getElementById(id);
    if (el) {
      el.remove();
      remaining--;
      document.getElementById('trashCount').textContent = `${remaining} Clutter Left`;
      if (remaining === 0) {
        document.getElementById('tip').innerHTML = '<span style="color:#38bdf8; font-weight:800; font-size:15px;">✨ Sparkling clean & fresh! Mental clarity restored.</span>';
      }
    }
  }

  function resetRoom() {
    location.reload();
  }
</script>
</body>
</html>
