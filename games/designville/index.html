<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Designville: Merge & Design</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: white; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 16px; overflow: hidden;
  }
  .header { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 440px; margin-bottom: 12px; }
  .title { font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 8px; color: #f59e0b; }
  .estate-view {
    position: relative; width: 380px; height: 180px; background: #fef08a;
    border-radius: 20px; border: 3px solid #facc15; box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .merge-grid {
    width: 380px; height: 190px; background: #1e293b; border-radius: 20px;
    border: 2px solid #334155; margin-top: 10px; display: grid; grid-template-columns: repeat(4, 1fr);
    padding: 8px; gap: 6px; box-shadow: 0 10px 25px rgba(0,0,0,0.4);
  }
  .merge-slot {
    background: #334155; border-radius: 12px; border: 1px dashed #64748b;
    display: flex; align-items: center; justify-content: center; font-size: 28px;
    cursor: pointer; transition: transform .15s;
  }
  .merge-slot:hover { transform: scale(1.08); border-color: #facc15; }
  .merge-slot.selected { border-color: #facc15; box-shadow: 0 0 10px #facc15; transform: scale(1.12); }
  .tip { margin-top: 12px; font-size: 13.5px; color: #fef08a; font-weight: 600; text-align: center; }
</style>
</head>
<body>
<div class="header">
  <div class="title"><span>🏡</span> Designville Merge</div>
  <div style="font-size:13px; color:#f59e0b; font-weight:800;" id="stars">⭐ 0 Stars</div>
</div>
<div class="estate-view" id="estate">
  <div style="font-size:55px;" id="mansionIcon">🏚️</div>
  <div style="font-weight:800; font-size:14px; color:#854d0e; margin-top:4px;" id="mansionLabel">Old Coastal Villa</div>
</div>
<div class="merge-grid" id="grid"></div>
<div class="tip" id="tip">Merge tools in the workshop below to earn stars & renovate the grand villa!</div>

<script>
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function chimeTone(f = 520) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.frequency.setValueAtTime(f, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(f * 1.5, audioCtx.currentTime + 0.15);
    g.gain.setValueAtTime(0.2, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.15);
  }

  // Tiers: 🔨 -> 🪚 -> 🪛 -> 🛋️
  const TIERS = ['🔨', '🪚', '🪛', '🛋️'];
  let slots = ['🔨', '🔨', '🔨', '🔨', '🪚', '🪚', null, null];
  let selected = null;
  let stars = 0;

  function renderGrid() {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    slots.forEach((item, idx) => {
      const el = document.createElement('div');
      el.className = 'merge-slot' + (selected === idx ? ' selected' : '');
      el.textContent = item || '';
      el.onclick = () => handleSlot(idx);
      grid.appendChild(el);
    });
  }

  function handleSlot(idx) {
    if (selected === null) {
      if (slots[idx]) { selected = idx; chimeTone(400); renderGrid(); }
    } else if (selected === idx) {
      selected = null; renderGrid();
    } else {
      if (slots[selected] === slots[idx]) {
        const curIdx = TIERS.indexOf(slots[idx]);
        if (curIdx < TIERS.length - 1) {
          slots[idx] = TIERS[curIdx + 1];
          slots[selected] = null;
          stars += 10;
          chimeTone(650);
          document.getElementById('stars').textContent = `⭐ ${stars} Stars`;
          if (stars >= 20) {
            document.getElementById('mansionIcon').textContent = '🏰';
            document.getElementById('mansionLabel').textContent = 'Luxury Dream Palace Renovated!';
            document.getElementById('tip').innerHTML = '<span style="color:#f59e0b; font-weight:800; font-size:15px;">🎉 Estate fully restored with architectural splendor!</span>';
          }
        }
      }
      selected = null;
      renderGrid();
    }
  }

  renderGrid();
</script>
</body>
</html>
