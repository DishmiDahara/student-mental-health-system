<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Botanica: Greenhouse of Wishes</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background: #022c22; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: white; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 16px; overflow: hidden;
  }
  .header { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 440px; margin-bottom: 12px; }
  .title { font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 8px; color: #6ee7b7; }
  .greenhouse-box {
    position: relative; width: 380px; height: 380px;
    background: radial-gradient(circle at 50% 30%, #065f46 0%, #022c22 100%);
    border-radius: 28px; border: 3px solid #059669; box-shadow: 0 25px 50px rgba(0,0,0,0.6);
    overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .plant-display { font-size: 110px; filter: drop-shadow(0 15px 30px rgba(0,0,0,0.5)); transition: transform .3s; }
  .droplets-canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .action-bar { display: flex; gap: 10px; width: 100%; max-width: 380px; margin-top: 14px; }
  .act-btn {
    flex: 1; background: #064e3b; border: 1px solid #10b981; color: white; padding: 10px;
    border-radius: 14px; font-size: 13px; font-weight: 800; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 4px; transition: transform .1s;
  }
  .act-btn:active { transform: scale(0.96); }
  .tip { margin-top: 12px; font-size: 13.5px; color: #a7f3d0; font-weight: 600; text-align: center; }
</style>
</head>
<body>
<div class="header">
  <div class="title"><span>🌺</span> Botanica Greenhouse</div>
  <div style="font-size:13px; color:#6ee7b7; font-weight:800;" id="flowerState">Exotic Orchid</div>
</div>
<div class="greenhouse-box">
  <div class="plant-display" id="plant">🌿</div>
  <canvas class="droplets-canvas" id="dropsCvs" width="380" height="380"></canvas>
</div>
<div class="action-bar">
  <button class="act-btn" onclick="mistPlant()">
    <span style="font-size:22px;">🚿</span>
    <span>Spray Mist</span>
  </button>
  <button class="act-btn" onclick="fertilize()">
    <span style="font-size:22px;">🧪</span>
    <span>Fertilizer</span>
  </button>
  <button class="act-btn" onclick="bloomFlower()">
    <span style="font-size:22px;">🌸</span>
    <span>Bloom</span>
  </button>
</div>
<div class="tip" id="tip">Mist the lush foliage and apply natural fertilizer to trigger exotic floral blooms!</div>

<script>
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function sprayHiss() {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(600, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.18);
    g.gain.setValueAtTime(0.2, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.18);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.18);
  }

  const cvs = document.getElementById('dropsCvs');
  const ctx = cvs.getContext('2d');
  let mistParticles = [];

  function mistPlant() {
    sprayHiss();
    for (let i = 0; i < 30; i++) {
      mistParticles.push({
        x: 190 + (Math.random() - 0.5) * 60,
        y: 120 + Math.random() * 80,
        vx: (Math.random() - 0.5) * 2,
        vy: 1 + Math.random() * 2,
        r: 2 + Math.random() * 2,
        alpha: 0.8
      });
    }
  }

  function fertilize() {
    sprayHiss();
    document.getElementById('plant').style.transform = 'scale(1.15)';
    document.getElementById('flowerState').textContent = 'Healthy & Flourishing';
  }

  function bloomFlower() {
    sprayHiss();
    document.getElementById('plant').textContent = '🌺';
    document.getElementById('plant').style.transform = 'scale(1.25)';
    document.getElementById('flowerState').textContent = 'Magnificent Bloom';
    document.getElementById('tip').innerHTML = '<span style="color:#6ee7b7; font-weight:800; font-size:15px;">🌸 The wish orchid is in full bloom! Inner harmony restored.</span>';
  }

  function update() {
    ctx.clearRect(0, 0, cvs.width, cvs.height);
    ctx.fillStyle = '#67e8f9';
    for (let i = mistParticles.length - 1; i >= 0; i--) {
      const p = mistParticles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.alpha *= 0.95;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
      if (p.alpha < 0.05) mistParticles.splice(i, 1);
    }
    requestAnimationFrame(update);
  }

  update();
</script>
</body>
</html>
