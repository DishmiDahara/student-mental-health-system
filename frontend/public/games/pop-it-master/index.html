<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Pop It Master</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body {
    background: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: white; overflow: hidden; padding: 16px;
  }
  .header { display: flex; align-items: center; justify-content: space-between; width: 100%; max-width: 480px; margin-bottom: 16px; }
  .title { font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
  .badge { background: rgba(255,255,255,0.1); padding: 4px 12px; border-radius: 999px; font-size: 13px; font-weight: 700; color: #38bdf8; }
  .controls { display: flex; gap: 8px; margin-bottom: 16px; }
  .btn {
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white;
    padding: 8px 16px; border-radius: 12px; font-size: 13px; font-weight: 700; cursor: pointer;
    transition: all .2s ease;
  }
  .btn:hover { background: rgba(255,255,255,0.2); transform: translateY(-1px); }
  .btn.active { background: #38bdf8; color: #0f172a; border-color: #38bdf8; }
  .board-container {
    perspective: 1000px; width: 100%; max-width: 420px; display: flex; justify-content: center;
  }
  .pop-board {
    width: 360px; height: 360px; border-radius: 40px; padding: 24px;
    background: linear-gradient(135deg, #ec4899, #8b5cf6, #3b82f6, #10b981, #f59e0b);
    box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 2px 4px rgba(255,255,255,0.4);
    display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px;
    transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    transform-style: preserve-3d;
  }
  .pop-board.flipped { transform: rotateY(180deg); }
  .bubble {
    border-radius: 50%; background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0.3) 25%, rgba(0,0,0,0.2) 100%);
    box-shadow: 0 6px 12px rgba(0,0,0,0.35), inset 0 -3px 4px rgba(0,0,0,0.3), inset 0 3px 6px rgba(255,255,255,0.8);
    cursor: pointer; transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  .bubble:hover { transform: scale(1.05); }
  .bubble.popped {
    box-shadow: inset 0 6px 10px rgba(0,0,0,0.6), inset 0 -2px 4px rgba(255,255,255,0.2);
    transform: scale(0.92); filter: brightness(0.85);
  }
  .stats { margin-top: 20px; font-size: 14px; color: #94a3b8; font-weight: 600; text-align: center; }
  .pulse-text { animation: pulse 1.5s infinite; color: #38bdf8; font-weight: 800; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
</style>
</head>
<body>
<div class="header">
  <div class="title"><span>🫧</span> Pop It Master</div>
  <div class="badge" id="counter">0 / 36 Popped</div>
</div>
<div class="controls">
  <button class="btn" id="flipBtn">🔄 Flip Board</button>
  <button class="btn" id="resetBtn">✨ Reset</button>
</div>
<div class="board-container">
  <div class="pop-board" id="board"></div>
</div>
<div class="stats" id="tip">Tap or drag across bubbles to pop them • Relieves tension & stress</div>

<script>
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playPopSound(freq = 420) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    const pitch = freq + (Math.random() * 80 - 40);
    osc.frequency.setValueAtTime(pitch, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(pitch * 0.4, audioCtx.currentTime + 0.08);
    gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.08);
  }

  const board = document.getElementById('board');
  const counter = document.getElementById('counter');
  const flipBtn = document.getElementById('flipBtn');
  const resetBtn = document.getElementById('resetBtn');
  const TOTAL = 36;
  let poppedCount = 0;
  let isFlipped = false;
  let isPointerDown = false;

  function createBoard() {
    board.innerHTML = '';
    poppedCount = 0;
    updateCounter();
    for (let i = 0; i < TOTAL; i++) {
      const b = document.createElement('div');
      b.className = 'bubble';
      b.dataset.id = i;
      b.addEventListener('pointerdown', (e) => {
        isPointerDown = true;
        popBubble(b);
      });
      b.addEventListener('pointerenter', () => {
        if (isPointerDown) popBubble(b);
      });
      board.appendChild(b);
    }
  }

  window.addEventListener('pointerup', () => isPointerDown = false);
  window.addEventListener('pointercancel', () => isPointerDown = false);

  function popBubble(el) {
    if (!el.classList.contains('popped')) {
      el.classList.add('popped');
      poppedCount++;
      playPopSound(350 + (poppedCount * 8));
      updateCounter();
      if (poppedCount === TOTAL) {
        document.getElementById('tip').innerHTML = '<span class="pulse-text">🎉 All popped! Flip the board to continue popping!</span>';
      }
    }
  }

  function updateCounter() {
    counter.textContent = `${poppedCount} / ${TOTAL} Popped`;
  }

  flipBtn.addEventListener('click', () => {
    isFlipped = !isFlipped;
    board.classList.toggle('flipped', isFlipped);
    playPopSound(250);
    setTimeout(() => {
      document.querySelectorAll('.bubble').forEach(b => b.classList.remove('popped'));
      poppedCount = 0;
      updateCounter();
      document.getElementById('tip').textContent = 'Board flipped! Pop the reverse side.';
    }, 300);
  });

  resetBtn.addEventListener('click', () => {
    document.querySelectorAll('.bubble').forEach(b => b.classList.remove('popped'));
    poppedCount = 0;
    updateCounter();
    document.getElementById('tip').textContent = 'Tap or drag across bubbles to pop them • Relieves tension & stress';
  });

  createBoard();
</script>
</body>
</html>
