<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Virtual Coral Aquarium</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #04101e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    canvas { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
    canvas:active { cursor: grabbing; }
    .header-tip { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); z-index: 10; color: #bae6fd; font-size: 13px; background: rgba(4, 16, 30, 0.75); backdrop-filter: blur(8px); padding: 6px 16px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.12); pointer-events: none; }
    .footer-bar { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; gap: 8px; background: rgba(4, 16, 30, 0.85); backdrop-filter: blur(8px); padding: 8px 16px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.12); }
    .btn { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.18); color: #bae6fd; padding: 6px 14px; border-radius: 999px; font-size: 12.5px; font-weight: 600; cursor: pointer; transition: all 0.15s; }
    .btn:hover { background: rgba(255,255,255,0.2); }
  </style>
</head>
<body>
  <div class="header-tip">🐠 Tap on the glass to startle fish · Drag to look around the reef</div>
  <canvas id="aquariumCanvas"></canvas>
  <div class="footer-bar">
    <button class="btn" onclick="addSchool()">🐟 Add Fish</button>
    <button class="btn" onclick="tapGlass(window.innerWidth/2, window.innerHeight/2)">🖐️ Tap Glass</button>
    <button class="btn" onclick="toggleSound()">🔊 Ambient Bubbles</button>
  </div>

  <script>
    const canvas = document.getElementById('aquariumCanvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    function resize() {
      const dpr = window.devicePixelRatio || 1;
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.scale(dpr, dpr);
    }
    window.addEventListener('resize', resize);
    resize();

    // Ambient Bubbles Audio Synthesizer
    let audioCtx = null;
    let audioEnabled = false;
    let bubbleInterval = null;

    function initAudio() {
      if (audioCtx) return;
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        audioEnabled = true;
        startBubblesSound();
      } catch (e) {}
    }

    function toggleSound() {
      if (!audioCtx) {
        initAudio();
        return;
      }
      audioEnabled = !audioEnabled;
      if (!audioEnabled && bubbleInterval) clearInterval(bubbleInterval);
      if (audioEnabled) startBubblesSound();
    }

    function startBubblesSound() {
      if (bubbleInterval) clearInterval(bubbleInterval);
      bubbleInterval = setInterval(() => {
        if (!audioEnabled || !audioCtx) return;
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        const freq = 400 + Math.random() * 400;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(freq * 1.6, audioCtx.currentTime + 0.1);
        g.gain.setValueAtTime(0.04, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.12);
      }, 350);
    }

    // Fish species
    const SPECIES = [
      { name: 'clownfish', body: '#ea580c', stripe: '#f8fafc', size: 18, speed: 1.4 },
      { name: 'bluetang', body: '#2563eb', stripe: '#facc15', size: 22, speed: 1.8 },
      { name: 'yellowtang', body: '#eab308', stripe: '#fef08a', size: 20, speed: 1.6 }
    ];

    class Fish {
      constructor(type) {
        this.spec = type || SPECIES[Math.floor(Math.random() * SPECIES.length)];
        this.x = Math.random() * width;
        this.y = 80 + Math.random() * (height - 180);
        this.z = 0.5 + Math.random() * 0.8; // depth factor (0.5 far, 1.3 near)
        this.vx = (Math.random() > 0.5 ? 1 : -1) * this.spec.speed * this.z;
        this.vy = (Math.random() - 0.5) * 0.4;
        this.wiggle = Math.random() * Math.PI * 2;
        this.wiggleSpeed = 0.14 + Math.random() * 0.05;
      }

      update() {
        this.wiggle += this.wiggleSpeed;
        this.x += this.vx;
        this.y += this.vy + Math.sin(this.wiggle) * 0.4;

        // Turn around at screen bounds
        if (this.x < -60) this.vx = Math.abs(this.vx);
        if (this.x > width + 60) this.vx = -Math.abs(this.vx);
        if (this.y < 60) this.vy = Math.abs(this.vy);
        if (this.y > height - 100) this.vy = -Math.abs(this.vy);
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.scale(this.vx > 0 ? this.z : -this.z, this.z);

        const tailAngle = Math.sin(this.wiggle) * 0.45;

        // Tail fin
        ctx.save();
        ctx.translate(-this.spec.size * 0.9, 0);
        ctx.rotate(tailAngle);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(-14, -10);
        ctx.lineTo(-10, 0);
        ctx.lineTo(-14, 10);
        ctx.closePath();
        ctx.fillStyle = this.spec.stripe;
        ctx.fill();
        ctx.restore();

        // Main Body Oval
        ctx.beginPath();
        ctx.ellipse(0, 0, this.spec.size, this.spec.size * 0.65, 0, 0, Math.PI * 2);
        ctx.fillStyle = this.spec.body;
        ctx.fill();

        // Characteristic Stripes (like Nemo's white bands)
        ctx.beginPath();
        ctx.ellipse(-2, 0, 4, this.spec.size * 0.62, 0, 0, Math.PI * 2);
        ctx.fillStyle = this.spec.stripe;
        ctx.fill();

        // Eye
        ctx.beginPath();
        ctx.arc(this.spec.size * 0.55, -this.spec.size * 0.2, 3, 0, Math.PI * 2);
        ctx.fillStyle = 'white';
        ctx.fill();
        ctx.beginPath();
        ctx.arc(this.spec.size * 0.6, -this.spec.size * 0.2, 1.5, 0, Math.PI * 2);
        ctx.fillStyle = '#0f172a';
        ctx.fill();

        ctx.restore();
      }
    }

    const fishes = [];
    for (let i = 0; i < 16; i++) {
      fishes.push(new Fish());
    }

    function addSchool() {
      for (let i = 0; i < 4; i++) fishes.push(new Fish());
    }

    // Bubbles
    const bubbles = [];
    for (let i = 0; i < 35; i++) {
      bubbles.push({
        x: Math.random() * width,
        y: Math.random() * height,
        r: 2 + Math.random() * 5,
        speed: 0.8 + Math.random() * 1.2,
        wobble: Math.random() * Math.PI
      });
    }

    // Glass tap ripples
    const tapRipples = [];
    function tapGlass(x, y) {
      initAudio();
      tapRipples.push({ x, y, r: 6, maxR: 70, alpha: 0.8 });
      // Startle nearby fish
      fishes.forEach(f => {
        const d = Math.hypot(f.x - x, f.y - y);
        if (d < 160) {
          f.vx = (f.x - x > 0 ? 1 : -1) * (2.8 + Math.random());
          f.vy = (f.y - y > 0 ? 1 : -1) * 1.5;
        }
      });
    }

    canvas.addEventListener('pointerdown', e => {
      const rect = canvas.getBoundingClientRect();
      tapGlass(e.clientX - rect.left, e.clientY - rect.top);
    });

    let time = 0;
    function loop() {
      time += 16;

      // 1. Deep Ocean Gradient
      const oceanGrad = ctx.createLinearGradient(0, 0, 0, height);
      oceanGrad.addColorStop(0, '#0284c7');
      oceanGrad.addColorStop(0.25, '#0369a1');
      oceanGrad.addColorStop(0.7, '#072b4a');
      oceanGrad.addColorStop(1, '#02111f');
      ctx.fillStyle = oceanGrad;
      ctx.fillRect(0, 0, width, height);

      // 2. Sunlight God Rays (caustics)
      ctx.save();
      ctx.globalAlpha = 0.08;
      ctx.fillStyle = '#ffffff';
      for (let i = 0; i < 5; i++) {
        const rayOffset = Math.sin(time * 0.001 + i * 1.4) * 40;
        ctx.beginPath();
        ctx.moveTo(width * (0.15 + i * 0.18) + rayOffset, 0);
        ctx.lineTo(width * (0.05 + i * 0.22) + rayOffset - 60, height);
        ctx.lineTo(width * (0.12 + i * 0.22) + rayOffset + 40, height);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();

      // 3. Coral Reef Floor & Sea Anemones
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.moveTo(0, height - 50);
      ctx.bezierCurveTo(width * 0.25, height - 90, width * 0.75, height - 30, width, height - 60);
      ctx.lineTo(width, height);
      ctx.lineTo(0, height);
      ctx.fill();

      // Swaying Seaweed & Sea Anemone Fronds
      for (let x = 30; x < width; x += 45) {
        const weedHeight = 70 + Math.sin(x) * 35;
        const sway = Math.sin(time * 0.002 + x) * 14;
        ctx.strokeStyle = (x % 90 === 0) ? '#059669' : '#047857';
        ctx.lineWidth = 6;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(x, height - 35);
        ctx.quadraticCurveTo(x + sway * 0.5, height - 35 - weedHeight * 0.5, x + sway, height - 35 - weedHeight);
        ctx.stroke();
      }

      // 4. Update & Render Fishes
      // Sort by depth (far first)
      fishes.sort((a, b) => a.z - b.z);
      fishes.forEach(f => {
        f.update();
        f.draw();
      });

      // 5. Rising Air Bubbles
      ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
      ctx.lineWidth = 1;
      bubbles.forEach(b => {
        b.wobble += 0.05;
        b.y -= b.speed;
        b.x += Math.sin(b.wobble) * 0.4;
        if (b.y < -10) {
          b.y = height + 10;
          b.x = Math.random() * width;
        }
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      });

      // 6. Glass Tap Shockwaves
      for (let i = tapRipples.length - 1; i >= 0; i--) {
        const r = tapRipples[i];
        r.r += 2.5;
        r.alpha -= 0.025;
        if (r.alpha <= 0) {
          tapRipples.splice(i, 1);
          continue;
        }
        ctx.beginPath();
        ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(224, 242, 254, ${r.alpha})`;
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
