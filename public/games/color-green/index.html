<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Green - Bart Bonte Style</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background: #022c22; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: white; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 16px; overflow: hidden; transition: background 0.6s ease;
  }
  .header { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 440px; margin-bottom: 16px; }
  .title { font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 8px; color: #34d399; }
  .game-box {
    width: 360px; height: 380px; background: #064e3b; border-radius: 24px;
    border: 2px solid #059669; box-shadow: 0 25px 50px rgba(0,0,0,0.5);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
  }
  .btn-green {
    width: 120px; height: 120px; border-radius: 50%; background: #10b981;
    border: 6px solid #34d399; box-shadow: 0 10px 25px rgba(16,185,129,0.5);
    color: white; font-size: 32px; font-weight: 900; display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: transform .1s, filter .1s;
  }
  .btn-green:active { transform: scale(0.92); filter: brightness(1.2); }
  .quadrant-grid { display: grid; grid-template-columns: 1fr 1fr; width: 240px; height: 240px; gap: 12px; }
  .quad {
    background: #042f2e; border: 2px solid #0d9488; border-radius: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-size: 28px;
    transition: background .3s;
  }
  .quad.active { background: #10b981; border-color: #34d399; }
  .tip { margin-top: 16px; font-size: 14px; color: #a7f3d0; font-weight: 700; text-align: center; }
</style>
</head>
<body>
<div class="header">
  <div class="title"><span>🟢</span> Green</div>
  <div style="font-size:13px; color:#34d399; font-weight:800;" id="lvlText">Level 1 of 3</div>
</div>
<div class="game-box" id="box">
  <!-- Level 1: Click button 5 times -->
  <div id="lvl1" style="display:flex; flex-direction:column; align-items:center;">
    <div class="btn-green" id="bigBtn" onclick="clickBigBtn()">5</div>
  </div>
  <!-- Level 2: 4 Quadrants -->
  <div id="lvl2" style="display:none;">
    <div class="quadrant-grid">
      <div class="quad" id="q0" onclick="clickQuad(0)">🌿</div>
      <div class="quad" id="q1" onclick="clickQuad(1)">🍃</div>
      <div class="quad" id="q2" onclick="clickQuad(2)">🌱</div>
      <div class="quad" id="q3" onclick="clickQuad(3)">🍀</div>
    </div>
  </div>
  <!-- Level 3: Pull cord -->
  <div id="lvl3" style="display:none; flex-direction:column; align-items:center;">
    <div style="font-size:64px; cursor:pointer;" onclick="pullCord()">💡</div>
    <div style="font-size:14px; margin-top:8px; color:#6ee7b7;">Tap the bulb to turn the room green!</div>
  </div>
</div>
<div class="tip" id="tip">Objective: Make the screen GREEN!</div>

<script>
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function chime(f = 520) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.frequency.setValueAtTime(f, audioCtx.currentTime);
    g.gain.setValueAtTime(0.2, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.25);
  }

  let level = 1;

  // Lvl 1
  let clicksLeft = 5;
  function clickBigBtn() {
    clicksLeft--;
    chime(400 + (5 - clicksLeft) * 80);
    document.getElementById('bigBtn').textContent = clicksLeft;
    if (clicksLeft === 0) {
      celebrateLevel(2);
    }
  }

  // Lvl 2
  let quadCount = 0;
  function clickQuad(idx) {
    const q = document.getElementById('q' + idx);
    if (!q.classList.contains('active')) {
      q.classList.add('active');
      quadCount++;
      chime(450 + (quadCount * 70));
      if (quadCount === 4) {
        celebrateLevel(3);
      }
    }
  }

  // Lvl 3
  function pullCord() {
    chime(700);
    document.body.style.background = '#059669';
    document.getElementById('box').style.background = '#10b981';
    document.getElementById('tip').innerHTML = '<span style="color:#ffffff; font-weight:800; font-size:16px;">🎉 Everything is serene GREEN! Well done!</span>';
  }

  function celebrateLevel(nextLvl) {
    document.getElementById('box').style.background = '#10b981';
    setTimeout(() => {
      document.getElementById('box').style.background = '#064e3b';
      level = nextLvl;
      document.getElementById('lvlText').textContent = `Level ${level} of 3`;
      document.getElementById('lvl1').style.display = level === 1 ? 'flex' : 'none';
      document.getElementById('lvl2').style.display = level === 2 ? 'block' : 'none';
      document.getElementById('lvl3').style.display = level === 3 ? 'flex' : 'none';
    }, 600);
  }
</script>
</body>
</html>
