<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Castaway Island / Tiny Town</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background: #082f49; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: white; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 16px; overflow: hidden;
  }
  .header { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 440px; margin-bottom: 12px; }
  .title { font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 8px; color: #38bdf8; }
  .ocean-box {
    position: relative; width: 380px; height: 380px;
    background: radial-gradient(circle at 50% 50%, #38bdf8 0%, #0284c7 60%, #0369a1 100%);
    border-radius: 28px; border: 4px solid #7dd3fc; box-shadow: 0 25px 50px rgba(0,0,0,0.6);
    overflow: hidden; cursor: pointer;
  }
  canvas { width: 100%; height: 100%; }
  .tip { margin-top: 14px; font-size: 13.5px; color: #bae6fd; font-weight: 600; text-align: center; }
</style>
</head>
<body>
<div class="header">
  <div class="title"><span>🏝️</span> Castaway Island</div>
  <div style="font-size:13px; color:#38bdf8; font-weight:800;" id="count">0 Buildings</div>
</div>
<div class="ocean-box" id="ocean">
  <canvas id="cvs" width="380" height="380"></canvas>
</div>
<div class="tip" id="tip">Click anywhere on the calm water to plop colorful procedural cottages!</div>

<script>
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function plopSound() {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.frequency.setValueAtTime(320, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(620, audioCtx.currentTime + 0.12);
    g.gain.setValueAtTime(0.2, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.12);
  }

  const cvs = document.getElementById('cvs');
  const ctx = cvs.getContext('2d');
  const HOUSES = ['🏡', '🏠', '🏰', '⛵', '🌴', '🗼'];
  let buildings = [];

  cvs.onpointerdown = e => {
    plopSound();
    const r = cvs.getBoundingClientRect();
    const x = e.clientX - r.left;
    const y = e.clientY - r.top;
    const icon = HOUSES[Math.floor(Math.random() * HOUSES.length)];
    buildings.push({ x, y, icon });
    document.getElementById('count').textContent = `${buildings.length} Buildings`;
    if (buildings.length >= 6) {
      document.getElementById('tip').innerHTML = '<span style="color:#bae6fd; font-weight:800; font-size:15px;">✨ A picturesque coastal island village has emerged!</span>';
    }
  };

  function render() {
    ctx.clearRect(0, 0, cvs.width, cvs.height);

    // Water ripple rings
    ctx.strokeStyle = 'rgba(255,255,255,0.2)';
    ctx.lineWidth = 2;
    buildings.forEach(b => {
      ctx.beginPath();
      ctx.ellipse(b.x, b.y + 10, 30, 15, 0, 0, Math.PI * 2);
      ctx.stroke();

      ctx.font = '40px sans-serif';
      ctx.fillText(b.icon, b.x - 20, b.y);
    });

    requestAnimationFrame(render);
  }

  render();
</script>
</body>
</html>
